# Sinh bởi tools/render_instance.py từ infrastructure/headscale/templates (template_version 1).
# KHÔNG sửa tay — render lại. Tenant: tenant-a (instance aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa) — §14.5.
# Network mg-t-tenant-a do Agent tạo (--internal, --subnet 10.250.0.0/29); compose không tạo và không xóa network.
# Không publish cổng nào; không khai báo biến môi trường TS_* nào (PL-15).
# Headscale: image chính thức — versions.lock [images.headscale] (rollback hoặc chưa rollout: còn lỗi V-26).
name: mg-t-tenant-a

services:
  hs-tenant-a:
    image: docker.io/headscale/headscale@sha256:11f81665e842809db9fe3006a38c56a66e968baa5abd4bac498e86445572b970
    container_name: mg-hs-tenant-a
    command: ["serve"]
    user: "30001:30001"
    read_only: true
    tmpfs:
      - /var/run/headscale:size=1m,mode=0700,uid=30001,gid=30001
    volumes:
      - type: bind
        source: /opt/meshguard/tenants/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa/config
        target: /etc/headscale
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/meshguard/tenants/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa/records
        target: /etc/headscale-records
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/meshguard/tenants/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa/data
        target: /var/lib/headscale
        bind:
          create_host_path: false
    networks:
      mg-t-tenant-a:
        aliases: [hs-tenant-a]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      meshguard.tenant_id: "11111111-1111-4111-8111-111111111111"
      meshguard.instance_id: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
      meshguard.role: tenant

networks:
  mg-t-tenant-a:
    external: true
