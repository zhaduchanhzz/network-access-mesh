# golangci-lint v2 (P2-T01) — phiên bản pin trong versions.lock và .github/workflows/go.yml.
version: "2"
run:
  timeout: 5m
  # Fixture phiên kiểm thử (P2-T15a, tests/security) chỉ build với tag này — lint cả nó; dockerintegration: test tích
  # hợp compose driver trên Docker thật (P3-T02, apps/agent/integration_test.go — chạy bằng tests/integration/agent/run.sh).
  build-tags: [mgtestfixture, dockerintegration]
linters:
  default: standard
  enable:
    - gosec
    - errorlint
    - bodyclose
    - noctx
  exclusions:
    rules:
      # G101 (chuỗi "giống credential") trong test là tên biến môi trường / đường dẫn file giả, không phải secret;
      # secret thật được chặn bởi gitleaks và test canary.
      - path: _test\.go
        linters: [gosec]
        text: G101
formatters:
  enable:
    - gofmt
