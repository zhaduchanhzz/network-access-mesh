# E2E UI bằng Playwright (P4-T14; §22.1 "E2E (UI)": hằng đêm + trước gate) — CHỈ chạy tay (workflow_dispatch) để tiết
# kiệm phút Actions; không chạy theo push/PR. Dựng stack dev/CI của tests/e2e/harness (như e2e-functional), chạy bộ
# apps/web/e2e trong image Playwright chính thức pin digest (versions.lock [images.playwright]) — trình duyệt chạy trong
# container, không cài lên runner — PW_RUNS lượt liên tiếp, rồi gỡ stack. Mọi credential sinh trong lượt chạy và chỉ nằm
# trong thư mục làm việc của stack (bị xóa khi gỡ); artifact gồm báo cáo HTML, results.json, log đã che secret và trace
# khi lỗi — harness dò lại mọi giá trị secret của lượt trong artifact, kể cả trong trace (ca PW-S). Kết quả chỉ "functional".
name: e2e-playwright

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Số lượt Playwright liên tiếp trên cùng stack (kiểm flaky)"
        required: false
        default: "2"

permissions:
  contents: read

jobs:
  e2e-playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      E2E_PREFIX: mgpw
      E2E_KEEP_CACHE: "0"
      PW_RUNS: ${{ inputs.runs }}
      NODE_IMAGE: docker.io/library/node@sha256:e6bedef217677b276c591795e169840edd9096dbf13f29df8ef8d1856b8820bc   # 26.13.1-trixie-slim (versions.lock)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: npm ci của apps/web trong Node pin digest (node_modules cho Playwright)
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/apps/web:/w" -w /w "$NODE_IMAGE" npm ci --no-fund --no-audit
      - name: make e2e-playwright (dựng → Playwright × PW_RUNS → gỡ; kết quả chỉ "functional")
        env:
          E2E_WORK: ${{ runner.temp }}/e2e-work
          E2E_OUT: ${{ runner.temp }}/e2e-out
        run: make e2e-playwright WEB_NODE_MODULES="$PWD/apps/web/node_modules"
      - name: Lưu báo cáo Playwright (HTML, results.json, trace khi lỗi) + log đã che secret
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: e2e-playwright
          path: ${{ runner.temp }}/e2e-out/
          retention-days: 14
          if-no-files-found: warn
