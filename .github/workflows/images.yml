# Build image tự làm (P1-T04, P2-T01, P2-T05, P2-T10a, P2-T03a): edge (Caddy + module), stund, api, worker, idp
# (Keycloak), headscale (Headscale v0.29.7 + bản vá V-26 — infrastructure/docker/headscale, ADR-02 sửa đổi 2026-11-17),
# backup (meshguard-backup + pg_dump 18.7 + age — project mg-backup). Mỗi image:
# build từ base pin theo digest, kiểm nội dung, sinh SBOM (syft), quét lỗ hổng (grype — chặn nếu có mức Critical), rồi
# mới push lên GHCR. Digest đưa vào versions.lock bằng commit riêng. Action và công cụ pin theo commit SHA / SHA-256,
# chọn bản đã ≥ 14 ngày tuổi. Ngoại lệ grype chỉ qua file riêng của từng image (cột grype_config — hiện chỉ idp), bắt
# buộc có hạn dùng; quá hạn thì job của image đó fail. Không có .grype.yaml ở gốc repo (grype tự nạp file đó cho mọi image).
name: images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["infrastructure/docker/**", "apps/**", "internal/**", "go.mod", "go.sum", ".github/workflows/images.yml"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: edge,   dockerfile: infrastructure/docker/edge/Dockerfile,  context: infrastructure/docker/edge,  app: "",     grype_config: ""}
          - {image: stund,  dockerfile: infrastructure/docker/stund/Dockerfile, context: infrastructure/docker/stund, app: "",     grype_config: ""}
          - {image: api,    dockerfile: infrastructure/docker/app/Dockerfile,   context: ".",                         app: api,    grype_config: ""}
          - {image: worker, dockerfile: infrastructure/docker/app/Dockerfile,   context: ".",                         app: worker, grype_config: ""}
          # idp: ngoại lệ CVE-2026-91403 có hạn — P2-T05 mục 7
          - {image: idp,    dockerfile: infrastructure/docker/idp/Dockerfile,   context: infrastructure/docker/idp,   app: "",     grype_config: infrastructure/docker/idp/grype.yaml}
          # headscale: bản vá V-26 (P2-T10a); unit test của các package bị vá chạy trong Dockerfile
          - {image: headscale, dockerfile: infrastructure/docker/headscale/Dockerfile, context: infrastructure/docker/headscale, app: "", grype_config: ""}
          # backup: pg-backup/idp-backup/edge-backup (P2-T03a, P2-T05b) — context gốc repo (apps/backup, internal/kit)
          - {image: backup, dockerfile: infrastructure/docker/backup/Dockerfile, context: ".",                        app: backup, grype_config: ""}
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image }}
      SYFT_VERSION: "1.56.0"
      SYFT_SHA256: "1c2493cfcf52d3367d6cb25780d9190c111c2219c34c820574c43e8bae15c528"
      GRYPE_VERSION: "0.121.1"
      GRYPE_SHA256: "bc3ea3f9e6fd56ac781c08c6c5e614271b79f438200757f6932085c19b0a4657"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Cài syft và grype (kiểm SHA-256)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo syft.tgz "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tgz" | sha256sum -c -
          curl -fsSLo grype.tgz "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  grype.tgz" | sha256sum -c -
          tar -xzf syft.tgz syft && tar -xzf grype.tgz grype

      - name: Build
        run: |
          args=()
          if [ -n "${{ matrix.app }}" ]; then args+=(--build-arg "APP=${{ matrix.app }}" --build-arg "VERSION=${GITHUB_SHA::12}" --build-arg "COMMIT=${GITHUB_SHA}"); fi
          docker build --pull -f "${{ matrix.dockerfile }}" "${args[@]}" -t "${IMAGE}:${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            "${{ matrix.context }}"

      - name: Kiểm nội dung image
        run: |
          user=$(docker image inspect -f '{{.Config.User}}' "${IMAGE}:${GITHUB_SHA}")
          case "${{ matrix.image }}" in
            edge)
              test "$user" = "10001:10001"
              docker run --rm --entrypoint caddy "${IMAGE}:${GITHUB_SHA}" list-modules \
                | grep -E '^(dns\.providers\.cloudflare|http\.handlers\.crowdsec|http\.handlers\.rate_limit)$'
              docker run --rm --cap-drop ALL --entrypoint caddy "${IMAGE}:${GITHUB_SHA}" version
              # healthprobe (HEALTHCHECK của compose): đúng 204 ⇒ 0, mã khác ⇒ 1, thiếu tham số ⇒ 2
              docker run -d --name smoke --cap-drop ALL --entrypoint caddy "${IMAGE}:${GITHUB_SHA}" \
                respond --status 204 --listen 127.0.0.1:8080
              for i in $(seq 1 20); do docker exec smoke /usr/bin/healthprobe http://127.0.0.1:8080/generate_204 && break; sleep 1; done
              docker exec smoke /usr/bin/healthprobe http://127.0.0.1:8080/generate_204 204
              rc=0; docker exec smoke /usr/bin/healthprobe http://127.0.0.1:8080/generate_204 200 || rc=$?; test "$rc" = 1
              rc=0; docker exec smoke /usr/bin/healthprobe || rc=$?; test "$rc" = 2
              docker rm -f smoke >/dev/null ;;
            stund)
              test "$user" = "65532:65532"
              out=$(docker run --rm "${IMAGE}:${GITHUB_SHA}" -h 2>&1 || true)
              echo "$out" | grep -q -- '-stun' ;;
            api|worker)
              test "$user" = "65532:65532"
              docker run -d --name smoke --read-only --cap-drop ALL -p 127.0.0.1:19090:9090 "${IMAGE}:${GITHUB_SHA}"
              for i in $(seq 1 20); do curl -fsS http://127.0.0.1:19090/healthz >/dev/null 2>&1 && break; sleep 1; done
              curl -fsS http://127.0.0.1:19090/healthz
              curl -fsS http://127.0.0.1:19090/readyz
              curl -fsS http://127.0.0.1:19090/metrics | grep -q '^meshguard_build_info{'
              # P2-T16: healthcheck của compose mg-app (distroless — không shell/curl) = /readyz của chính tiến trình
              docker exec smoke /usr/local/bin/meshguard healthcheck
              docker logs smoke 2>&1 | tail -3
              docker rm -f smoke >/dev/null
              if [ "${{ matrix.image }}" = worker ]; then
                # P2-T04a: lệnh kek-drill của nghi thức khóa trên keyring thử sinh tại chỗ (không in khóa; chỉ dòng kết quả)
                k="${RUNNER_TEMP}/kek"
                for r in kek-app kek-ops; do
                  mkdir -p "$k/live/$r"
                  (umask 077; openssl rand -hex 32 > "$k/live/$r/smoke"; echo smoke > "$k/live/$r/ACTIVE")
                done
                cp -a "$k/live" "$k/recovered"
                out=$(docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
                  -u "$(id -u):$(id -g)" -v "$k:/k:ro" "${IMAGE}:${GITHUB_SHA}" kek-drill --live /k/live --recovered /k/recovered)
                rm -rf "$k"
                echo "$out" | tail -1
                test "$(echo "$out" | tail -1)" = "kek-drill: PASS (2 keyrings, 2 kek_ids)"
              fi ;;
            idp)
              test "$user" = "1000"
              # CVE-2026-91403 (P2-T05 mục 7): TrustManager mặc định của JVM không được tin root nào trong 4 root OpenJDK yêu
              # cầu gỡ (openjdk.org/emudhra). grype không thấy việc gỡ này (ngoại lệ ở bước quét dựa vào kiểm tra ở đây).
              docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
                -v "${GITHUB_WORKSPACE}/infrastructure/docker/idp/TrustCheck.java:/check/TrustCheck.java:ro" \
                --entrypoint java "${IMAGE}:${GITHUB_SHA}" -XX:-UsePerfData /check/TrustCheck.java > "${RUNNER_TEMP}/idp-trust.txt"
              head -1 "${RUNNER_TEMP}/idp-trust.txt"
              n=$(grep -vc '^#' "${RUNNER_TEMP}/idp-trust.txt"); echo "JVM tin ${n} CA"; test "$n" -ge 100
              if grep -E 'CN=(emSign Root CA - G[12]|emSign ECC Root CA - G3|AAA Certificate Services)(,|$)' "${RUNNER_TEMP}/idp-trust.txt"; then
                echo "::error::JVM của image idp vẫn tin root eMudhra/Comodo AAA (CVE-2026-91403)"; exit 1
              fi
              # tùy chọn build-time đã nướng sẵn (kc.sh show-config, rootfs chỉ đọc như compose) và đúng bản Keycloak của Dockerfile
              docker run --rm --network none --read-only --cap-drop ALL "${IMAGE}:${GITHUB_SHA}" show-config > "${RUNNER_TEMP}/idp-config.txt"
              grep -Eq 'kc\.db +[=:] +postgres' "${RUNNER_TEMP}/idp-config.txt"
              grep -Eq 'kc\.features-disabled +[=:] +impersonation,kerberos,ciba,device-flow,token-exchange-standard' "${RUNNER_TEMP}/idp-config.txt"
              grep -Eq 'kc\.health-enabled +[=:] +true' "${RUNNER_TEMP}/idp-config.txt"
              grep -Eq 'kc\.metrics-enabled +[=:] +true' "${RUNNER_TEMP}/idp-config.txt"
              kc=$(sed -n 's|^ARG KEYCLOAK=quay\.io/keycloak/keycloak:\([^@]*\)@sha256:.*|\1|p' "${{ matrix.dockerfile }}")
              test -n "$kc"
              docker run --rm --network none --read-only --cap-drop ALL "${IMAGE}:${GITHUB_SHA}" --version > "${RUNNER_TEMP}/idp-version.txt"
              cat "${RUNNER_TEMP}/idp-version.txt"
              grep -qxF "Keycloak ${kc}" "${RUNNER_TEMP}/idp-version.txt" ;;
            headscale)
              # versions.lock [sources.headscale] ↔ Dockerfile + patches/series; `headscale version` = v0.29.7 + commit của
              # bản vá (dấu bản vá); serve như compose tenant: uid riêng không phải root, rootfs chỉ đọc, health qua PATH
              bash infrastructure/docker/headscale/check-image.sh "${IMAGE}:${GITHUB_SHA}" ;;
            backup)
              test "$user" = "10007:20007"
              run=(docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges)
              # pg_dump/pg_dumpall/pg_restore là bản 18.7 của image postgres pin; age đúng sha256 của build tái lập (versions.lock)
              for b in pg_dump pg_dumpall pg_restore; do
                "${run[@]}" --entrypoint "/usr/local/bin/$b" "${IMAGE}:${GITHUB_SHA}" --version | grep -E "^$b \(PostgreSQL\) 18\.7 "
              done
              test "$("${run[@]}" --entrypoint /usr/local/bin/age "${IMAGE}:${GITHUB_SHA}" --version)" = "v1.3.2"
              "${run[@]}" "${IMAGE}:${GITHUB_SHA}" version
              cid=$(docker create "${IMAGE}:${GITHUB_SHA}")
              docker export "$cid" > "${RUNNER_TEMP}/backup-fs.tar"
              docker rm "$cid" >/dev/null
              want=$(python3 -c 'import tomllib; print(tomllib.load(open("versions.lock", "rb"))["sources"]["age"]["age_linux_amd64_sha256"])')
              test "$(tar -xOf "${RUNNER_TEMP}/backup-fs.tar" usr/local/bin/age | sha256sum | cut -d' ' -f1)" = "$want"
              # tệp thực thi trong các thư mục bin: đúng dash (/bin/sh — pg_dumpall gọi popen) + 5 công cụ; không bash/perl/coreutils
              tar -tvf "${RUNNER_TEMP}/backup-fs.tar" | awk '$1 ~ /^-..x/ && $6 ~ /^(usr\/)?(local\/)?s?bin\// {print $6}' | sort > "${RUNNER_TEMP}/backup-exec.txt"
              cat "${RUNNER_TEMP}/backup-exec.txt"
              printf '%s\n' usr/bin/dash usr/local/bin/age usr/local/bin/meshguard-backup usr/local/bin/pg_dump \
                usr/local/bin/pg_dumpall usr/local/bin/pg_restore | cmp - "${RUNNER_TEMP}/backup-exec.txt"
              # thiếu recipient ⇒ từ chối (exit 2), không ghi gì
              rc=0; "${run[@]}" -e MG_BACKUP_TARGET=edge "${IMAGE}:${GITHUB_SHA}" check || rc=$?; test "$rc" = 2
              # smoke: pg_dump thật tới PostgreSQL 18.7 (versions.lock [images.postgres]) → 2 file ciphertext age + status.
              # Recipient = khóa VÍ DỤ công khai trong README của age (không phải khóa của nền tảng); giải mã/restore được
              # diễn tập ở tests/backup/drill.sh với khóa dùng một lần.
              pg=docker.io/library/postgres@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
              d="${RUNNER_TEMP}/bk"; mkdir -p "$d/out"; chmod 0777 "$d/out"
              printf 'ci-%s\n' "${GITHUB_RUN_ID}" > "$d/pw"; chmod 0644 "$d/pw"
              docker network create bk-smoke >/dev/null
              docker run -d --name bk-pg --network bk-smoke -e POSTGRES_PASSWORD_FILE=/pw -v "$d/pw:/pw:ro" -e POSTGRES_DB=meshguard "$pg" >/dev/null
              for i in $(seq 1 60); do docker exec bk-pg pg_isready -q -h 127.0.0.1 -U postgres && break; sleep 1; done
              docker run --rm --network bk-smoke --read-only --cap-drop ALL --security-opt no-new-privileges \
                --tmpfs /run/mgbackup:size=1m,mode=0700,uid=10007,gid=20007 -v "$d/out:/backups" -v "$d/pw:/run/secrets/pw:ro" \
                -e MG_BACKUP_TARGET=postgres -e MG_BACKUP_RECIPIENT=age1ql3z7hjy54pw3hyww5ayyfg7zqgvc7w3j2elw8zmrj2kg5sfn9aqmcac8p \
                -e MG_BACKUP_PG_HOST=bk-pg -e MG_BACKUP_PG_DATABASE=meshguard -e MG_BACKUP_PG_USER=postgres \
                -e MG_BACKUP_PG_PASSWORD_FILE=/run/secrets/pw "${IMAGE}:${GITHUB_SHA}" once --label manual | tail -3
              docker rm -f bk-pg >/dev/null; docker network rm bk-smoke >/dev/null
              ls -l "$d/out"
              sudo chmod -R a+rX "$d/out"   # file 0640 thuộc 10007:20007 (UID của dịch vụ) — chỉ để runner đọc kiểm
              n=0; for f in "$d"/out/*.age; do test "$(head -c 21 "$f")" = "age-encryption.org/v1"; n=$((n + 1)); done; test "$n" = 2
              python3 -c 'import json, sys; s = json.load(open(sys.argv[1])); assert s["last_attempt"]["ok"] and len(s["last_success"]["files"]) == 2' "$d/out/status.json" ;;
          esac
          echo "user=$user OK"

      - name: SBOM (syft)
        run: |
          "${RUNNER_TEMP}/syft" "${IMAGE}:${GITHUB_SHA}" -q -o spdx-json="${RUNNER_TEMP}/sbom-${{ matrix.image }}.spdx.json"
          echo "packages in SBOM: $(jq '.packages | length' "${RUNNER_TEMP}/sbom-${{ matrix.image }}.spdx.json")"

      - name: Quét lỗ hổng (grype) — chặn nếu có mức Critical; ngoại lệ quá hạn cũng chặn
        run: |
          args=()
          cfg="${{ matrix.grype_config }}"
          if [ -n "$cfg" ]; then
            # ngoại lệ chỉ từ file riêng của image này; file phải có đúng một dòng "# expires: YYYY-MM-DD" — quá ngày đó (UTC) ⇒ fail
            exp=$(sed -n 's/^# expires: \([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\)$/\1/p' "$cfg")
            if [ "$(printf '%s' "$exp" | grep -c '^')" != 1 ] || [ "$(date -u -d "$exp" +%F 2>/dev/null)" != "$exp" ]; then
              echo "::error file=${cfg}::cần đúng một dòng '# expires: YYYY-MM-DD' (ngày hợp lệ)"; exit 1
            fi
            if [[ "$(date -u +%F)" > "$exp" ]]; then
              echo "::error file=${cfg}::ngoại lệ grype đã hết hạn (${exp}) — chủ dự án quyết định gia hạn hoặc gỡ ngoại lệ"; exit 1
            fi
            echo "ngoại lệ grype ${cfg}: còn hiệu lực tới hết ${exp} (UTC)"
            echo "- ${{ matrix.image }}: ngoại lệ grype \`${cfg}\`, hết hạn ${exp}" >> "$GITHUB_STEP_SUMMARY"
            args+=(--config "$cfg" --show-suppressed)
          fi
          "${RUNNER_TEMP}/grype" "sbom:${RUNNER_TEMP}/sbom-${{ matrix.image }}.spdx.json" "${args[@]}" --fail-on critical

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-${{ matrix.image }}
          path: ${{ runner.temp }}/sbom-${{ matrix.image }}.spdx.json
          retention-days: 90

      - name: Push lên GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker-config"
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "${IMAGE}:${GITHUB_SHA}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${GITHUB_SHA}")
          echo "pushed: ${digest}"
          echo "### ${{ matrix.image }}: \`${digest}\`" >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
