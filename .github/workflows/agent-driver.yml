# Test tích hợp compose driver của Host Agent trên Docker thật (P3-T02; master §11.3 bước 7–11, §14.2–§14.5, §14.4):
# tests/integration/agent/run.sh build image agent từ cây của commit (infrastructure/docker/agent/Dockerfile — base,
# Go toolchain và docker-compose pin theo digest/SHA-256 trong versions.lock) và binary test (build tag
# dockerintegration), rồi chạy test BÊN TRONG image agent với đúng hardening của compose mg-agent (network none,
# rootfs chỉ đọc, cap_drop ALL + CHOWN/FOWNER/DAC_OVERRIDE, no-new-privileges): tenant dùng-một-lần với image
# [images.mg-headscale] thật — thư mục, file, network, compose up, healthy, status; mọi lời gọi lặp lại (idempotent);
# stop/start/restart; remove giữ data và hội tụ lại; ca âm (object trùng tên mang label lạ hoặc không label ⇒ từ chối,
# không đụng gì); remove xóa data. P3-T03 (TestAgentOperationsEndToEnd, không PostgreSQL/worker): configtest trong container
# tạm, policy + API key qua CLI trong container, gắn/gỡ edge (edge giả: container alpine pin digest), edge supervisor khi
# edge bị tạo lại, start guard. P3-T18 (TestQuarantineReleaseEndToEnd): edge Caddy thật [images.caddy] với site tenant render
# từ infrastructure/caddy/Caddyfile.tmpl — quarantine ⇒ 404 thống nhất, release qua start guard + post-start gate. Snapshot `docker ps -a`, `docker network ls` và thư mục gốc tạm trước/sau phải trùng.
# Không dùng secret nào (token agent sinh trong test); chỉ action đã pin theo commit SHA. Lọc theo đường dẫn để tiết
# kiệm phút Actions: chỉ khi agent, driver, template instance, template edge, image agent hoặc test thay đổi.
name: agent-driver

on:
  push:
    branches: [main]
    paths: ["apps/agent/**", "internal/provisioning/agentspec/**", "internal/provisioning/driver/**", "api/agent/**",
            "infrastructure/docker/agent/**", "infrastructure/headscale/templates/**", "infrastructure/caddy/Caddyfile.tmpl",
            "tests/integration/agent/**",
            "go.mod", "go.sum", "versions.lock", ".github/workflows/agent-driver.yml"]
  pull_request:
    paths: ["apps/agent/**", "internal/provisioning/agentspec/**", "internal/provisioning/driver/**", "api/agent/**",
            "infrastructure/docker/agent/**", "infrastructure/headscale/templates/**", "infrastructure/caddy/Caddyfile.tmpl",
            "tests/integration/agent/**",
            "go.mod", "go.sum", "versions.lock", ".github/workflows/agent-driver.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Compose driver + thao tác Agent (P3-T03) trên Docker thật — tenant dùng-một-lần trong image agent đã hardening
        run: AGENTIT_OUT="${RUNNER_TEMP}/agentit" AGENTIT_KEEP_CACHE=0 bash tests/integration/agent/run.sh
      - name: Lưu log và snapshot trước/sau
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: agent-driver
          path: ${{ runner.temp }}/agentit/
          retention-days: 14
          if-no-files-found: warn
