# Stack dev/CI P2-T01a (compose.yaml ở gốc repo, tests/e2e/harness): PostgreSQL (migration bằng store.MigrateAll),
# backend P2-T16 (image api/worker build từ cây, project mg-app render bằng tools/render_app.py: db-bootstrap, migrate,
# api, worker — E2E-17…E2E-25: edge app./admin./auth., đăng nhập OIDC có TOTP, adopt, đồng bộ thiết bị, audit),
# Keycloak với 3 realm, edge render từ Caddyfile thật (TLS từ CA nội bộ sinh mới mỗi lượt — CHỈ cho CI), 2 Headscale
# (render bằng tools/render_instance.py), stund, 4 client Tailscale chính thức pin digest; chạy E2E-01…E2E-16. Mọi kết
# quả chỉ là "functional" (client và Headscale cùng một host — HS-24, §22.1), không bao giờ "network E2E verified".
# Image pin theo digest trong versions.lock, action pin theo commit SHA; không dùng secret nào của repo (D-12; repo
# private từ 2026-11-17 nhưng workflow vẫn không cần secret): mọi credential (mật khẩu DB, admin Keycloak, token edge, pre-auth key, API key, khóa CA) sinh trong lượt chạy,
# chỉ tồn tại trên runner và bị xóa khi gỡ stack. Artifact chỉ gồm log đã che secret + kết quả (harness dò lại mọi giá
# trị secret của lượt chạy trong artifact — ca E2E-16).
name: e2e-functional

on:
  push:
    branches: [main]
    paths: ["compose.yaml", "tests/e2e/**", "tests/security/edge/conformance.py", "infrastructure/environments/ci/**",
            "infrastructure/caddy/**", "infrastructure/headscale/templates/**", "infrastructure/idp/**",
            "infrastructure/compose/compose.edge.yaml.tmpl", "infrastructure/compose/compose.idp.yaml.tmpl",
            "tools/mgenv.py", "tools/render_instance.py", "tools/render_edge.py", "tools/render_idp.py", "database/**",
            "internal/store/**", "versions.lock", "Makefile", ".github/workflows/e2e-functional.yml",
            "apps/**", "internal/**", "go.mod", "go.sum", "infrastructure/docker/app/**",
            "infrastructure/compose/compose.app.yaml.tmpl", "tools/render_app.py"]
  pull_request:
    paths: ["compose.yaml", "tests/e2e/**", "tests/security/edge/conformance.py", "infrastructure/environments/ci/**",
            "infrastructure/caddy/**", "infrastructure/headscale/templates/**", "infrastructure/idp/**",
            "infrastructure/compose/compose.edge.yaml.tmpl", "infrastructure/compose/compose.idp.yaml.tmpl",
            "tools/mgenv.py", "tools/render_instance.py", "tools/render_edge.py", "tools/render_idp.py", "database/**",
            "internal/store/**", "versions.lock", "Makefile", ".github/workflows/e2e-functional.yml",
            "apps/**", "internal/**", "go.mod", "go.sum", "infrastructure/docker/app/**",
            "infrastructure/compose/compose.app.yaml.tmpl", "tools/render_app.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-functional:
    runs-on: ubuntu-24.04
    timeout-minutes: 50   # + build image api/worker từ cây (P2-T16)
    env:
      E2E_PREFIX: mge2e
      E2E_KEEP_CACHE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Môi trường runner (phiên bản Docker/Compose/openssl/python)
        run: |
          docker version --format 'docker {{.Server.Version}}'
          docker compose version
          openssl version
          python3 --version
      - name: make e2e-functional (dựng → E2E-01…E2E-25 → gỡ; kết quả chỉ "functional")
        # context `runner` chỉ dùng được ở cấp step — đặt ở `env` của job làm GitHub từ chối cả file workflow
        env:
          E2E_WORK: ${{ runner.temp }}/e2e-work
          E2E_OUT: ${{ runner.temp }}/e2e-out
        run: make e2e-functional
      - name: Lưu kết quả (summary, results.json, log đã che secret, cấu hình compose đã ghép, Caddyfile của CI)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: e2e-functional
          path: ${{ runner.temp }}/e2e-out/
          retention-days: 14
          if-no-files-found: warn
