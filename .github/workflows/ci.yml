# CI khung (P0-T04): docs-check (lint master, sinh lại docs/ và kiểm đã commit, ROADMAP, sơ đồ §21.2, link; từ P2-T02
# thêm spec-lint api/openapi.yaml), type TypeScript sinh từ spec khớp bản đã commit (P2-T02) và quét secret toàn bộ
# lịch sử. Chạy trên runner của GitHub (repo public — D-12): PR từ fork chạy trong sandbox của GitHub với token chỉ
# đọc, workflow này không dùng secret nào. Action pin theo commit SHA, image pin theo digest (§25.1 quy tắc 8).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: docs-check
        run: python3 tools/docs_check.py
      - name: docs/ khớp với master đã commit
        run: git diff --exit-code -- docs/ || { echo "::error::docs/ lệch với master — chạy 'make docs' rồi commit"; exit 1; }
      - name: Golden test của các tool render (instance Headscale, edge, IdP, backup, backend mg-app, agent mg-agent, monitoring mg-obs) + bước migrate của host
        run: |
          python3 tools/test_mgenv.py
          python3 tools/test_render_instance.py
          python3 tools/test_render_edge.py
          python3 tools/test_render_idp.py
          python3 tools/test_render_backup.py
          python3 tools/test_render_app.py
          python3 tools/test_render_agent.py
          python3 tools/test_render_monitoring.py
          python3 tools/test_host_migrate.py
      - name: Spec-lint api/openapi.yaml (x-permission hai chiều với §8.5/§8.6, x-task, tenant chỉ từ path, action path, problem+json; seed RBAC + bảng authz đã sinh khớp master/spec — P2-T07) + test
        run: |
          python3 tools/openapi_lint.py
          python3 tools/test_openapi_lint.py

  # P3-T16: bộ cảnh báo tối thiểu — promtool/amtool của ĐÚNG image pin trong versions.lock ([images.prometheus],
  # [images.alertmanager]; tools/test_render_monitoring.py kiểm hai digest dưới đây trùng versions.lock): cú pháp + unit
  # test của mọi rule, và cấu hình Prometheus/Alertmanager đã render của ba môi trường mẫu (tests/golden/monitoring).
  monitoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROMETHEUS_IMAGE: docker.io/prom/prometheus@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2   # v3.15.1
      ALERTMANAGER_IMAGE: docker.io/prom/alertmanager@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b   # v0.34.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: promtool check rules + test rules (mỗi rule bắn đúng nhãn/annotation, không bắn ngoài ngưỡng)
        run: |
          docker run --rm -v "$PWD/infrastructure/monitoring/rules:/r:ro" -w /r --entrypoint /bin/promtool "$PROMETHEUS_IMAGE" \
            check rules meshguard.rules.yml
          docker run --rm -v "$PWD/infrastructure/monitoring/rules:/r:ro" -w /r --entrypoint /bin/promtool "$PROMETHEUS_IMAGE" \
            test rules meshguard.rules.test.yml
      - name: promtool check config + amtool check-config trên bản render mẫu (staging, production, ci)
        run: |
          sec="${RUNNER_TEMP}/obs-secrets"; mkdir -p "$sec"
          for f in edge_metrics_token smtp_password telegram_bot_token smtp_ca; do echo dummy > "$sec/$f"; done
          echo https://hooks.example.invalid/x > "$sec/alert_webhook_url"; chmod 0644 "$sec"/*
          for d in tests/golden/monitoring/*/expected/monitoring; do
            echo "== $d"
            docker run --rm -v "$PWD/$d/prometheus:/etc/prometheus:ro" -v "$sec/edge_metrics_token:/run/secrets/edge_metrics_token:ro" \
              --entrypoint /bin/promtool "$PROMETHEUS_IMAGE" check config /etc/prometheus/prometheus.yml
            docker run --rm -v "$PWD/$d/alertmanager:/etc/alertmanager:ro" -v "$sec:/run/secrets:ro" \
              --entrypoint /bin/amtool "$ALERTMANAGER_IMAGE" check-config /etc/alertmanager/alertmanager.yml
          done

  api-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_IMAGE: docker.io/library/node@sha256:e6bedef217677b276c591795e169840edd9096dbf13f29df8ef8d1856b8820bc   # 26.13.1-trixie-slim (versions.lock)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Sinh lại type TypeScript (openapi-typescript pin trong apps/web/package-lock.json) và đọc spec bằng js-yaml
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -v "${RUNNER_TEMP}:/out" \
            -w /src/apps/web "$NODE_IMAGE" \
            sh -c 'npm ci --ignore-scripts --no-audit --no-fund && npm run --silent gen:api && npm run --silent spec:json > /out/spec.json'
      - name: apps/web/src/api khớp api/openapi.yaml đã commit
        run: git diff --exit-code -- apps/web/src/api/ || { echo "::error::type TypeScript lệch spec — chạy 'make api-gen' rồi commit"; exit 1; }
      - name: Spec-lint đọc spec giống hệt js-yaml
        run: python3 tools/openapi_lint.py --compare-json "${RUNNER_TEMP}/spec.json"

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cài gitleaks (kiểm SHA-256)
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tgz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/gitleaks.tgz" -C "${RUNNER_TEMP}" gitleaks
      - name: Quét secret (lịch sử git và cây làm việc)
        run: |
          "${RUNNER_TEMP}/gitleaks" git --config .gitleaks.toml --redact --no-banner .
          "${RUNNER_TEMP}/gitleaks" dir --config .gitleaks.toml --redact --no-banner .
