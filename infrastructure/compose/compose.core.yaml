# Project mg-core (P1-T06, §14.4) — Management Plane. Bản Phase 1: postgres + stund; crowdsec được thêm cùng edge
# (P1-T06 phần 2, cần token DNS cho chứng chỉ). Image pin theo digest (versions.lock); secret dạng file (§14.2).
# Network do infrastructure/host/networks.sh tạo trước (external). Đặt tại /opt/meshguard/core/compose.core.yaml.
name: mg-core

services:
  postgres:
    image: docker.io/library/postgres@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc   # 18.7-trixie
    user: "999:999"
    read_only: true
    tmpfs:
      - /var/run/postgresql:size=1m,mode=0775,uid=999,gid=999
      - /tmp:size=64m,mode=1777
    environment:
      POSTGRES_DB: meshguard
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
    secrets:
      - pg_superuser_password
    volumes:
      - pg-data:/var/lib/postgresql
    networks: [mg-data]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    shm_size: 128m
    mem_limit: 1g
    pids_limit: 256
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "meshguard"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    labels:
      meshguard.role: core

  stund:   # chế độ Local Development: STUN dùng chung nghe UDP 3478 trên host LAN (khi có VPS thì chạy trên VPS — §10.1)
    image: ghcr.io/zhaduchanhzz/network-access-mesh/stund@sha256:30a359fddac7027dc9abd794c0405ebfff72c2ce79043e331353c5060483fce0
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    labels:
      meshguard.role: core

secrets:
  pg_superuser_password:
    file: /opt/meshguard/secrets/postgres/superuser_password

volumes:
  pg-data:

networks:
  mg-data:
    external: true
