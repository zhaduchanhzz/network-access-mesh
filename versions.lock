# versions.lock — phiên bản và digest được phép dùng (P0-T03; §25.1 quy tắc 8 của master).
#
# - Mọi image trong compose/Dockerfile phải pin đúng digest ở đây; Host Agent chỉ chạy image có digest trong
#   danh sách này (§11.1). Thay đổi chỉ qua PR, ghi lý do (bản vá bảo mật, nâng minor theo §17.6).
# - Digest lấy từ registry chính thức qua Registry HTTP API v2 (registry-1.docker.io, ghcr.io, gcr.io) ngày
#   2026-11-16; với mỗi manifest và config blob đã kiểm sha256(nội dung) == Docker-Content-Digest.
# - Commit của mã nguồn lấy từ GitHub API (tag được tham chiếu đến commit).
# - Chính sách: ưu tiên bản phát hành đã ≥ 14 ngày; bản mới hơn chỉ được chọn khi là bản vá bảo mật (ghi ở `note`).
# - `user` = user mặc định trong config của image; `run_as` = UID:GID dùng khi chạy (§14.2), "chọn ở <task>" nếu chưa chốt.

