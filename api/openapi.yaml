            schema:
              $ref: '#/components/schemas/ApprovalDecision'
      responses:
        '200':
          description: Yêu cầu sau khi duyệt và thực thi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
