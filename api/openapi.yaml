    post:
      tags: [invitations]
      operationId: createTenantInvitation
      summary: Mời một người chưa từng đăng nhập vào tenant
      description: |-
        Lời mời ghi IdP đang `active` của tenant, email và role; role theo quy tắc role đích 3a (§8.4: thấp hơn hẳn role
        của người mời trừ Owner; không bao giờ là Owner). Lần đăng nhập đầu tiên qua đúng IdP đó, với email đã xác minh
        trùng email mời (không phân biệt hoa thường) và còn hạn, tạo membership với role này — một lần. Email đã có
        lời mời đang chờ hoặc đã là thành viên ⇒ `409`. Không trả token: thư mời đi qua outbox (`tenant.invitation`,
        P3-T05b).
      security:
        - sessionCookie: []
          csrfToken: []
      x-permission: tenant.invitation:manage
      x-task: P3-T05a
      x-audit-action: invitation.create
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreate'
      responses:
        '201':
          description: Lời mời đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Unexpected'
  /tenants/{tenantId}/invitations/{invitationId}:
    delete:
      tags: [invitations]
      operationId: revokeTenantInvitation
      summary: Thu hồi một lời mời đang chờ
      description: Role ghi trong lời mời theo quy tắc role đích 3a; lời mời không còn `pending` ⇒ `409`.
      security:
        - sessionCookie: []
          csrfToken: []
      x-permission: tenant.invitation:manage
      x-task: P3-T05a
      x-audit-action: invitation.revoke
      parameters:
