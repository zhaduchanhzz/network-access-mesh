        '200':
          description: Thiết lập sau khi ghi (hoặc không đổi)
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettingsView'
        '202':
