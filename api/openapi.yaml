      tags: [invitations]
      operationId: revokeTenantInvitation
      summary: Thu hồi một lời mời đang chờ
      description: Role ghi trong lời mời theo quy tắc role đích 3a; lời mời không còn `pending` ⇒ `409`.
      security:
        - sessionCookie: []
