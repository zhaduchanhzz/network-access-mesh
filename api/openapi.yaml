    IdentityProvider:
      type: object
      description: >-
        Đăng ký IdP (`identity_providers` — §8.2): bộ ba (issuer, client_id, ràng buộc tổ chức). `issuer`, `client_id`,
        `driver`, `scope` bất biến; client secret không bao giờ được trả (`client_secret_set` cho biết đã có).
      required: [id, scope, issuer, client_id, driver, status, required_claims, require_email_verified, allowed_email_domains, claim_mapping, client_secret_set, created_at, updated_at, version, etag]
      properties:
        id:
          type: string
          format: uuid
        scope:
          type: string
          enum: [platform, tenant]
        tenant_id:
          type: string
          format: uuid
          description: Tenant của hàng `scope=tenant`
        issuer:
          type: string
        client_id:
          type: string
        driver:
          type: string
          enum: [keycloak, external]
        status:
          $ref: '#/components/schemas/IdentityProviderStatus'
        required_claims:
          type: object
          additionalProperties: true
          x-go-type: json.RawMessage
        require_email_verified:
          type: boolean
        allowed_email_domains:
          type: array
          items:
            type: string
        claim_mapping:
          type: object
          additionalProperties:
            type: string
        client_secret_set:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 1
        etag:
          type: string
    IdentityProviderList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IdentityProvider'
        next_cursor:
          type: [string, 'null']
    IdentityProviderUpdate:
      type: object
      description: >-
        Ràng buộc của IdP sửa được (§8.2 MVP); ít nhất một trường. `issuer`, `client_id`, `driver` khai báo chỉ để bị từ
        chối (`422` — bất biến).
      additionalProperties: false
      minProperties: 1
      properties:
        claim_mapping:
          type: object
          maxProperties: 8
          description: 'Trường hồ sơ → tên claim: khóa `email`, `email_verified`, `name`'
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 128
        required_claims:
          type: object
          maxProperties: 16
          description: 'Tên claim → giá trị bắt buộc (chuỗi/số/bool, hoặc mảng các giá trị chấp nhận)'
          additionalProperties: true
          x-go-type: json.RawMessage
        allowed_email_domains:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 253
        issuer:
          description: Bất biến — có mặt ⇒ `422`
        client_id:
          description: Bất biến — có mặt ⇒ `422`
        driver:
          description: Bất biến — có mặt ⇒ `422`
    TenantIdentityProviderUpdate:
      type: object
      description: Như `IdentityProviderUpdate`, thêm `client_secret` chỉ-ghi của IdP `external`; ít nhất một trường
      additionalProperties: false
      minProperties: 1
      properties:
        claim_mapping:
          type: object
          maxProperties: 8
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 128
        required_claims:
          type: object
          maxProperties: 16
          additionalProperties: true
          x-go-type: json.RawMessage
        allowed_email_domains:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 253
        client_secret:
          type: string
          writeOnly: true
          minLength: 16
          maxLength: 512
          description: Client secret mới của IdP `external` (16–512 ký tự ASCII nhìn thấy được) — vào SecretStore, không trả lại
        issuer:
          description: Bất biến — có mặt ⇒ `422`
        client_id:
          description: Bất biến — có mặt ⇒ `422`
        driver:
          description: Bất biến — có mặt ⇒ `422`
