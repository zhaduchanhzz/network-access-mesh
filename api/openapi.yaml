  # ------------------------------------------------------------ console quản trị Keycloak (§8.2 (3) — P3-T15)
  /platform/idp-console/sessions:
    get:
      tags: [platform]
      operationId: listIdpConsoleSessions
      summary: Phiên console quản trị Keycloak — đang chờ duyệt, đang mở, đã kết thúc
      description: |-
        Mỗi phiên là một yêu cầu dual control `platform.idp.console_session` (§8.6), mới nhất trước. `status`:
        `pending` (chờ người thứ hai), `active` (đã duyệt, trong thời hạn — console mở được cho đúng người yêu cầu, từ
        đúng `source_cidr`), `ended` (hết thời hạn), `rejected`, `expired` (không ai duyệt kịp). Console chỉ phục vụ ở
        origin admin, sau cổng `forward_auth` của edge (`GET /internal/edge/idp-console`, không thuộc hợp đồng public).
      x-permission: platform.idp:read
      x-task: P3-T15
      x-audit-action: platform.idp.console_session.list
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang phiên console
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdpConsoleSessionList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Unexpected'
    post:
      tags: [platform]
      operationId: requestIdpConsoleSession
      summary: Xin một phiên console quản trị Keycloak — luôn 2P; 202 + Location của yêu cầu phê duyệt
      description: |-
        Console quản trị của Keycloak do nền tảng host (realm master) chỉ mở theo phiên có thời hạn đã được người thứ
        hai duyệt (§8.2 (3), như break-glass): người xin phải step-up (đăng nhập trong 15 phút); payload ghi người xin
        (`identity_id`), `source_cidr` (mặc định đúng địa chỉ của người xin, /32 hoặc /128; IPv4 tối đa /24, IPv6 tối
        đa /56) và `duration_minutes` (5–60, mặc định 30). Người duyệt (`POST /platform/approvals/{id}/approve`) phải
        khác người xin, step-up, và cũng giữ `platform.idp:console` — tức một Super Admin thứ hai. Phiên chạy từ lúc
        duyệt tới hết thời hạn; trong phiên, cổng `forward_auth` của edge trên `admin.<domain>` chỉ cho đúng người xin,
        còn phiên Platform Console, từ địa chỉ thuộc `source_cidr`. Mỗi lần đăng nhập console sinh security event
        `idp.console_login` và thông báo cho Super Admin/Platform Operator (job `idp.audit_sync`). Đang có yêu cầu mở
        của chính người xin ⇒ `409`.
      security:
        - sessionCookie: []
          csrfToken: []
      x-permission: platform.idp:console
      x-dual-control: true
      x-task: P3-T15
      x-audit-action: platform.idp.console_session.request
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdpConsoleSessionCreate'
      responses:
        '202':
          description: Yêu cầu phê duyệt đã tạo — người thứ hai duyệt ở `Location`
          headers:
            Location:
              $ref: '#/components/headers/ApprovalLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Unexpected'
  /tenants/{tenantId}/invitations:
    get:
      tags: [invitations]
      operationId: listTenantInvitations
      summary: Lời mời của tenant
      description: Mới nhất trước; `status` là trạng thái hiệu lực (`pending` đã quá `expires_at` là `expired`).
      x-permission: tenant.invitation:manage
      x-task: P3-T05a
