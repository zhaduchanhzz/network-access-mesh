# MeshGuard ZTNA — SaaS API v1, contract-first (§13 của docs/planning/implementation-master-plan.md).
# Nguồn sự thật cho server Go (oapi-codegen strict server → internal/httpapi/gen) và type TypeScript
# (openapi-typescript → apps/web/src/api/schema.d.ts). Sửa file này rồi chạy `make api-gen`; CI fail khi code sinh ra
# lệch spec. `make api-lint` (tools/openapi_lint.py) kiểm mọi operation theo §13.1, §13.2, §8.5, §8.6 và §20.
# Phạm vi hiện tại (P2-T02): các operation Phase 2 trong bảng truy vết của §13.2. Nhóm của phase sau được thêm vào
# ở task xây nhóm đó — trong v1 chỉ thay đổi cộng thêm (§13.1).
# Cú pháp: tập con YAML mà spec-lint đọc được (không anchor/alias/tag, không plain scalar nhiều dòng) — xem tool.
openapi: 3.1.0
info:
  title: MeshGuard ZTNA API
  version: 1.0.0-alpha.1
  summary: API SaaS của Management Plane — không phải Headscale API
  description: |-
    API SaaS do MeshGuard thiết kế (§13 của master). Headscale API chỉ được gọi từ `internal/headscale` ở phía server;
    trình duyệt không bao giờ gọi Headscale và không giữ Headscale API key.

    **Quy ước chung (§13.1)**

    - **Tenant**: luôn là path param `{tenantId}` (UUID) — không nhận tenant từ body, header hay query. Ngoại lệ duy nhất
      là `GET /auth/login?tenant=<slug>`: slug chỉ dùng để định tuyến đăng nhập.
    - **Xác thực**: cookie session `__Host-mg_session` (BFF, §8.3). Method không an toàn (`POST`, `PUT`, `PATCH`,
      `DELETE`) cần thêm header `X-CSRF-Token` (lấy từ `GET /auth/session`) và `Origin`/`Sec-Fetch-Site` hợp lệ.
    - **Lỗi**: RFC 9457 `application/problem+json` (schema `Problem`) với `code` ổn định; không có stack trace, không có
      thông điệp thô chứa secret. ID thuộc tenant khác trả `404`.
    - **Phân trang**: cursor — `?limit=50&cursor=<opaque>` (tối đa 200); response `{items, next_cursor}`
      (`next_cursor = null` ở trang cuối); thứ tự ổn định.
    - **Idempotency**: `Idempotency-Key` bắt buộc cho `POST` tạo tài nguyên/job. Lặp cùng key và cùng request ⇒ trả lại
      kết quả đã lưu; cùng key khác request ⇒ `422 idempotency_key_reuse`; request trước chưa xong ⇒ `409` +
      `Retry-After`.
    - **Thao tác dài**: `202 Accepted` + `Location: /api/v1/tenants/{tenantId}/jobs/{jobId}` (người gọi phạm vi tenant)
      hoặc `/api/v1/platform/jobs/{jobId}` (phạm vi platform); client poll job.
    - **Đồng thời**: `ETag` + `If-Match` (§6.1) cho tài nguyên sửa được đồng thời.
    - **Rate limit**: header `RateLimit-*` và `Retry-After`; vượt hạn mức ⇒ `429 rate_limited`.
    - **Truy vết**: `X-Request-Id` (sinh nếu thiếu) có trong mọi response, trùng `Problem.request_id`.
    - **Độ tươi**: dữ liệu lấy từ cache kèm `synced_at`.

    **Extension của spec** (kiểm bằng `tools/openapi_lint.py`)

    - `x-permission` — đúng một quyền của §8.5/§8.6, hoặc `public` / `authenticated` / `internal` (§13.1).
    - `x-task` — ID task ở §20 xây operation, khớp bảng truy vết của §13.2.
    - `x-audit-action` — giá trị `audit_events.action` của operation: sự kiện từ chối của mọi operation (§8.8), sự
      kiện thành công của thao tác ghi; thao tác gọi Headscale hoặc chạy bằng job ghi cặp `<action>.requested` →
      `<action>.succeeded` / `<action>.failed` (§6.1).
    - `x-own-resource: true` — ô ○ của §8.6: role có scope `own` chỉ gọi được operation này, trên tài nguyên của chính mình.
    - `x-dual-control: true` — ô 2P của §8.5/§8.6.
    - `x-conditions: [<điều kiện>]` — ô có điều kiện của §8.5/§8.6 mà operation tự kiểm (ví dụ `restore_only` — Platform
      Operator chỉ duyệt yêu cầu restore); grant có điều kiện không khai báo ở đây bị từ chối.
    - `x-secret-once: true` — trường secret chỉ hiển thị một lần.
servers:
  - url: /api/v1
    description: Cùng origin với Portal — `app.<domain>` (Tenant Portal) và `admin.<domain>` (Platform Console)
security:
  - sessionCookie: []
tags:
  - name: auth
    description: Đăng nhập OIDC qua BFF, session, CSRF (§8.3) — P2-T06
  - name: tenants
    description: Tenant mà người gọi là thành viên (§13.2) — P2-T11
  - name: dashboard
    description: Tổng quan của tenant, số liệu thật kèm `synced_at` (§16.4) — P2-T13a
  - name: devices
    description: Sổ thiết bị, đổi tên, thu hồi hai pha, đồng bộ (§13.2, §13.5) — P2-T13
  - name: users
    description: Thành viên của tenant, chỉ đọc ở Phase 2 (§13.2) — P2-T11
  - name: audit
    description: Nhật ký hành động quản trị (§6.1, §16.5) — P2-T08
  - name: jobs
    description: Job của tenant, phép chiếu an toàn (§13.3, §13.5) — P2-T12
  - name: notifications
    description: Thông báo trong Portal của chính người gọi (§13.2, §6.3 `notification_outbox`) — P3-T05b
  - name: platform
    description: Platform Console, chỉ phục vụ trên origin `admin.<domain>` (§12.2, §13.2) — P2-T08, P2-T11, P2-T12, P2-T13a
  - name: approvals
    description: Dual control trong tenant — yêu cầu phê duyệt phạm vi tenant (§8.6) — P3-T04a
  - name: invitations
    description: Lời mời người chưa từng đăng nhập (§6.3, §8.2) — P3-T05a
paths:
  # ---------------------------------------------------------------- auth (P2-T06)
  /auth/login:
    get:
      tags: [auth]
      operationId: authLogin
      summary: Bắt đầu đăng nhập OIDC — chuyển hướng tới IdP
      description: |-
        §8.3 bước 1–2. IdP được chọn từ DB theo tenant (`identity_providers` đang `active`) — **không** nhận từ client.
        Backend ghi một hàng `auth_requests` (hash của `state`, `idp_id`, `nonce`, PKCE verifier đã mã hóa, origin, hạn
        ≤ 10 phút), đặt cookie `__Host-mg_authreq` ràng buộc trình duyệt rồi chuyển hướng (Authorization Code + PKCE
        S256). `scope=platform` chỉ được phục vụ trên origin quản trị.
      security: []
      x-permission: public
      x-task: P2-T06
      x-audit-action: auth.login_start
      parameters:
        - name: scope
          in: query
          required: true
          description: Phạm vi đăng nhập — `tenant` trên `app.<domain>`, `platform` trên `admin.<domain>`
          schema:
            type: string
            enum: [tenant, platform]
        - name: tenant
          in: query
          required: false
          description: >-
            Slug của tenant, bắt buộc khi `scope=tenant`. Chỉ dùng để định tuyến đăng nhập (§13.1) — không phải ngữ
            cảnh tenant của API.
          schema:
            $ref: '#/components/schemas/TenantSlug'
        - name: return_to
          in: query
          required: false
          description: Đường dẫn tương đối trong Portal để quay lại sau khi đăng nhập (chặn open redirect)
          schema:
            type: string
            maxLength: 512
            pattern: '^/([^/\\\s][^\s]*)?$'
        - name: reauth
          in: query
          required: false
          description: >-
            `true` ⇒ xác thực lại tường minh (step-up, §8.3 bước 7): IdP được yêu cầu `prompt=login` và `max_age=0`, kể
            cả khi request chưa mang session nào. Vắng hoặc `false` ⇒ step-up chỉ khi request đã mang session hợp lệ của
            chính origin này (suy ra, P2-T06).
          schema:
            type: boolean
            default: false
      responses:
        '302':
          description: Chuyển hướng tới authorization endpoint của IdP; đặt cookie `__Host-mg_authreq`
          headers:
            Location:
              $ref: '#/components/headers/RedirectLocation'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Unexpected'
  /auth/callback/{idpId}:
    get:
      tags: [auth]
      operationId: authCallback
      summary: Callback OIDC của một IdP — tạo session
      description: |-
        §8.3 bước 3–4. Mỗi IdP có redirect URI riêng. **Trước khi** gọi token endpoint, callback từ chối khi
        `auth_requests.idp_id` ≠ `{idpId}`, origin hoặc cookie ràng buộc không khớp, hàng đã dùng/hết hạn, hoặc tham số
        `iss` khác issuer đã lưu (RFC 9207) — chặn IdP mix-up (T-20). Sau đó mới đổi code và kiểm chữ ký, `iss`, `aud`,
        `nonce`, `exp`, `required_claims`, email đã xác minh, domain (§8.2); đạt hết mới upsert `identities (idp_id, sub)`.
        Thành công: cookie `__Host-mg_session` (opaque 256-bit, server chỉ lưu hash) và chuyển hướng về `return_to`.
      security: []
      x-permission: public
      x-task: P2-T06
      x-audit-action: auth.login
      parameters:
        - $ref: '#/components/parameters/IdpId'
        - name: state
          in: query
          required: true
          schema:
            type: string
            maxLength: 512
        - name: code
          in: query
          required: false
          description: Authorization code — vắng khi IdP trả lỗi
          schema:
            type: string
            maxLength: 4096
        - name: iss
          in: query
          required: false
          description: Issuer theo RFC 9207 — phải khớp khi IdP công bố `authorization_response_iss_parameter_supported`
          schema:
            type: string
            maxLength: 1024
        - name: error
          in: query
          required: false
          description: Mã lỗi do IdP trả (người dùng hủy, từ chối…) — callback trả `401`
          schema:
            type: string
            maxLength: 256
        - name: error_description
          in: query
          required: false
          schema:
            type: string
            maxLength: 1024
        - name: __Host-mg_authreq
          in: cookie
          required: false
          description: Cookie ràng buộc trình duyệt đặt ở `GET /auth/login` — thiếu hoặc không khớp ⇒ `401`
          x-go-name: AuthRequestCookie
          schema:
            type: string
            maxLength: 256
      responses:
        '302':
          description: Đăng nhập thành công; đặt cookie `__Host-mg_session` và chuyển hướng về `return_to`
          headers:
            Location:
              $ref: '#/components/headers/RedirectLocation'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
        '401':
          $ref: '#/components/responses/AuthCallbackUnauthenticated'
        '403':
          $ref: '#/components/responses/AuthCallbackForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/AuthCallbackUnexpected'
  /auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      summary: Đăng xuất — thu hồi session hiện tại và kết thúc phiên SSO của IdP
      description: |-
        Thu hồi phía server có hiệu lực ngay (§8.3 bước 6) và xóa cookie `__Host-mg_session`. Rồi kết thúc cả phiên của
        IdP (OIDC RP-Initiated Logout 1.0 — G2 vòng 2, A-1): `redirect_to` là `end_session_endpoint` của issuer kèm
        `client_id`, `post_logout_redirect_uri` (= `https://<origin>/`, đăng ký trong realm) và `id_token_hint` của lần
        đăng nhập (giữ phía server, đã mã hóa bằng khóa chỉ cookie của session này mở được). Portal điều hướng trình
        duyệt (top-level, không fetch) tới `redirect_to`; IdP kết thúc phiên SSO rồi trả về `post_logout_redirect_uri`.
        IdP không có `end_session_endpoint` (hoặc không tới được) ⇒ `redirect_to` = `post_logout_redirect_uri`.
      security:
        - sessionCookie: []
          csrfToken: []
      x-permission: authenticated
      x-task: P2-T06
      x-audit-action: auth.logout
      responses:
        '200':
          description: Đã thu hồi session; điều hướng trình duyệt tới `redirect_to`
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResult'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Unexpected'
  /auth/session:
    get:
      tags: [auth]
      operationId: getAuthSession
      summary: Principal, membership, grant đang hiệu lực và CSRF token của session hiện tại
      description: |-
        §8.3 bước 5 và 8. Session chỉ mang danh tính — membership, role và grant được nạp từ DB ở mỗi request.
        `csrf_token` = HMAC-SHA256(key = session id, msg = "csrf-v1"), gửi lại trong header `X-CSRF-Token` cho method
        không an toàn. Response có `Cache-Control: no-store`.
      x-permission: authenticated
      x-task: P2-T06
      x-audit-action: auth.session.read
      responses:
        '200':
          description: Session hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Unexpected'
  /auth/sessions:
    get:
      tags: [auth]
      operationId: listAuthSessions
      summary: Các session đang hiệu lực của chính người gọi
      x-permission: authenticated
      x-task: P2-T06
      x-audit-action: auth.session.list
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Unexpected'
  /auth/sessions/{sessionId}:
    delete:
      tags: [auth]
      operationId: revokeAuthSession
      summary: Thu hồi một session của chính mình
      description: Session của identity khác trả `404` (§8.4 bất biến 6); thu hồi có hiệu lực ở request kế tiếp.
      security:
        - sessionCookie: []
          csrfToken: []
      x-permission: authenticated
      x-task: P2-T06
      x-audit-action: auth.session.revoke
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204':
          description: Đã thu hồi
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Unexpected'
  # ---------------------------------------------------------------- tenants (P2-T11)
  /tenants:
    get:
      tags: [tenants]
      operationId: listMyTenants
      summary: Các tenant mà người gọi là thành viên
      x-permission: authenticated
      x-task: P2-T11
      x-audit-action: tenant.list
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Unexpected'
  /tenants/{tenantId}:
    get:
      tags: [tenants]
      operationId: getTenant
      summary: Thông tin tenant của người gọi
      x-permission: tenant.tenant:read
      x-task: P2-T11
      x-audit-action: tenant.read
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Tenant
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Unexpected'
  # ---------------------------------------------------------------- dashboard (P2-T13a)
  /tenants/{tenantId}/dashboard:
    get:
      tags: [dashboard]
      operationId: getTenantDashboard
      summary: Tổng quan của tenant — số liệu từ cache và health của instance
      description: >-
        Mỗi số kèm `synced_at`/`checked_at`; không có số liệu giả (§12.3, §16.4). Tenant chỉ lấy từ path; không nhận
        tham số truy vấn nào. Mục chưa có nguồn thật (policy, route, relay, security event; sổ thiết bị chưa từng sync)
        nằm trong `unavailable` kèm lý do — được bổ sung thành số liệu (cộng thêm) ở task xây nguồn của mục đó.
      x-permission: tenant.dashboard:read
      x-task: P2-T13a
      x-audit-action: dashboard.read
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Số liệu tổng quan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDashboard'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Unexpected'
  # ---------------------------------------------------------------- devices (P2-T13)
  /tenants/{tenantId}/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: Danh sách thiết bị (từ sổ thiết bị, kèm `synced_at`)
      description: |-
        End User chỉ thấy thiết bị của chính mình — có `owner` là chính họ và không có tag (§8.4 bất biến 3b).
        `fresh=true` (giới hạn tần suất) chạy một lần sync có giới hạn thời gian rồi trả **trang 1**; `fresh=true` kèm
        `cursor` ⇒ `422`; instance không phản hồi ⇒ `503 instance_unavailable` (§13.1).
      x-permission: tenant.device:read
      x-own-resource: true
      x-task: P2-T13
      x-audit-action: device.list
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: online
          in: query
          required: false
          schema:
            type: boolean
        - name: owner
          in: query
          required: false
          description: Lọc theo membership sở hữu
          schema:
            type: string
            format: uuid
        - name: tag
          in: query
          required: false
          schema:
            type: string
            pattern: '^tag:[a-z][a-z0-9-]{0,49}$'
        - name: q
          in: query
          required: false
          description: Tìm theo tên thiết bị
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: fresh
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Một trang thiết bị
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/InstanceUnavailable'
        default:
          $ref: '#/components/responses/Unexpected'
  /tenants/{tenantId}/devices/sync:
    post:
      tags: [devices]
      operationId: syncDevices
      summary: Yêu cầu đồng bộ sổ thiết bị từ Headscale
      description: >-
