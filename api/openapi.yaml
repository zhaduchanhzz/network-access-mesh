      tags: [policies]
      operationId: applyTenantPolicy
      summary: Đặt version đã duyệt làm mong muốn và áp dụng (202 + job policy.apply)
      description: |-
        Version phải `approved` (khác ⇒ `409`) và `parent_version_id` phải là version mong muốn hiện tại (khác ⇒ `409`
        `stale_base` — hai bản nháp cùng gốc không ghi đè nhau, §7.3). Cùng transaction: version thành desired, version
        mong muốn cũ ⇒ `superseded`, audit `policy.desired_set`, job `policy.apply` (trigger `manual`; job chưa xong của
        tenant được dùng lại). Áp dụng lại version đang là desired ⇒ chỉ thêm job. Tenant bật 4-eyes ⇒ cần step-up
        (`401 reauth_required`). Job: render với bảng hiện tại → lint → `CheckPolicy` → `SetPolicy` → `GetPolicy` khớp
        `applied_sha256`, ghi `policy_applications`.
      security:
        - sessionCookie: []
          csrfToken: []
      x-permission: tenant.policy:apply
      x-task: P4-T10
      x-audit-action: policy.desired_set
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PolicyVersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Version là mong muốn; job policy.apply ở `Location`
          headers:
            Location:
              $ref: '#/components/headers/JobLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyApplyAccepted'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Unexpected'
  /tenants/{tenantId}/policies/{versionId}/rollback:
    post:
      tags: [policies]
      operationId: rollbackTenantPolicy
      summary: Rollback về nội dung của một version trước (202 + job policy.apply)
      description: |-
        Tạo version `N+1` với nội dung của `{versionId}` (`rollback_of`), `parent_version_id` = version mong muốn hiện
        tại. Phê duyệt chỉ được kế thừa khi `content_sha256` trùng một nội dung đã từng được duyệt (§7.3) — nội dung chưa
        từng được duyệt hoặc version không có kiểu ⇒ `409`. Lint trên bảng hiện tại (không gọi Headscale) chặn ⇒ `422`.
        Cùng transaction: version mới thành desired, version cũ `superseded`, audit `policy.rollback`, job `policy.apply`
        (trigger `rollback`). Tenant bật 4-eyes ⇒ cần step-up.
      security:
        - sessionCookie: []
          csrfToken: []
      x-permission: tenant.policy:apply
      x-task: P4-T10
      x-audit-action: policy.rollback
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PolicyVersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Version rollback là mong muốn; job policy.apply ở `Location`
          headers:
            Location:
              $ref: '#/components/headers/JobLocation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyApplyAccepted'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Unexpected'
  /tenants/{tenantId}/policies/{versionId}/diff:
    get:
      tags: [policies]
      operationId: diffTenantPolicy
      summary: Diff của version so với version khác (mặc định version mong muốn)
      description: |-
        Cả hai bên render với bảng hiện tại: diff dòng của chuỗi đã render (bỏ khi tài liệu quá lớn — `lines_omitted`)
        và diff có cấu trúc của `grants` (thêm/bớt). `against` mặc định = version mong muốn; không có ⇒ so với rỗng.
      x-permission: tenant.policy:read
      x-task: P4-T10
      x-audit-action: policy.diff
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PolicyVersionId'
        - $ref: '#/components/parameters/PolicyAgainst'
      responses:
        '200':
          description: Diff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDiff'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Unexpected'
  /tenants/{tenantId}/policies/import:
    post:
      tags: [policies]
      operationId: importTenantPolicy
      summary: Dịch HuJSON của admin sang mô hình có kiểu (không lưu, không gọi Headscale)
      description: |-
        Bộ dịch HuJSON ↔ `PolicySource` của editor (P4-T11, §7.2 — chạy phía server: chỉ server biết mọi tên, kể cả tài
        nguyên mạng). Văn bản được parse bằng parser của Headscale (`tailscale/hujson`) rồi dịch tên ⇒ id: `group:<tên>`,
        `tag:<tên>` của danh mục, e-mail của thành viên hoặc `mg-<membership>@` ⇒ `user`, tên tài nguyên (alias `hosts`) ⇒
        `resource`, `autogroup:<x>`, `*`/IP/prefix ⇒ `cidr`. Chỉ nhận `grants` (bắt buộc — thiếu, `null` hay không phải
        mảng ⇒ L1), `ssh`, `autoApprovers`; `groups`/`hosts`/`tagOwners` (render từ bảng), `acls`, `nodeAttrs`, `tests`,
        khóa lạ ⇒ L3; khóa `#…`, khóa trùng hoặc sai hoa thường, `null` ⇒ `decoder_guard`; văn bản rỗng ⇒ L2; tên không
        tồn tại ⇒ L6. `200` cả khi không dịch được (`result: failed` kèm `errors` có `path`/`line`); `source` chỉ có khi
        `passed` — editor đặt nó vào form và lưu bằng `PATCH /policies/{versionId}` như mọi lần sửa. Xác nhận
        (`acknowledgements`) không nằm trong văn bản.
      security:
        - sessionCookie: []
          csrfToken: []
      x-permission: tenant.policy:edit
      x-task: P4-T11
      x-audit-action: policy.import
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyImportRequest'
      responses:
        '200':
          description: Kết quả dịch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyImport'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Unexpected'
  /tenants/{tenantId}/policies/export:
    post:
      tags: [policies]
      operationId: exportTenantPolicy
      summary: Viết một PolicySource thành HuJSON có tên (không lưu)
      description: |-
        Chiều ngược của `import` (P4-T11): thành viên viết bằng e-mail khi e-mail đó là duy nhất trong tenant (không thì
        `mg-<membership>@`), group/tag/tài nguyên bằng tên; tham chiếu không còn tồn tại ⇒ chỗ giữ chỗ không dịch ngược
        được + cảnh báo L6. Tất định (cùng nguồn + cùng bảng ⇒ cùng văn bản). `principals` = tên của mọi principal được
        tham chiếu (editor dùng để hiển thị). `source` được kiểm như bản nháp (sai ⇒ `422`). Là POST vì nhận nội dung đang
        soạn (chưa lưu); không đổi gì.
      security:
        - sessionCookie: []
          csrfToken: []
      x-permission: tenant.policy:read
      x-task: P4-T11
      x-audit-action: policy.export
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyExportRequest'
      responses:
        '200':
          description: HuJSON có tên
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyExport'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Unexpected'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-mg_session
      description: Session phía server (BFF, §8.3) — opaque 256-bit, server chỉ lưu hash; trình duyệt không giữ token của IdP
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Bắt buộc cho method không an toàn (§8.3 bước 5); giá trị lấy từ `GET /auth/session`
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      description: ID tenant (UUID) — nguồn duy nhất của ngữ cảnh tenant (§13.1)
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: ID thiết bị của nền tảng (UUID), ánh xạ `(tenant, headscale_node_id)` — không nhận node id thô của Headscale
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      description: ID thông báo (`notification_outbox.id`) gửi cho chính người gọi
      schema:
        type: string
        format: uuid
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InstanceId:
      name: instanceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    # platform hosts (P3-T04)
    HostId:
      name: hostId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HostStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/HostStatus'
    HostRegionFilter:
      name: region
      in: query
      required: false
      description: Lọc theo vùng (khớp chính xác)
      schema:
        type: string
        minLength: 1
        maxLength: 64
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >-
        `ETag` của tài nguyên lúc đọc (§6.1, §13.1). Thao tác sửa cần nó: thiếu (hoặc `*`) ⇒ `428 precondition_required`,
        không khớp phiên bản hiện tại ⇒ `412 precondition_failed`. Khai báo không bắt buộc ở tầng binding để thiếu header
        nhận đúng `428`
      schema:
        type: string
        maxLength: 512
    IdpId:
      name: idpId
      in: path
      required: true
      description: ID của IdP (`identity_providers.id`) — mỗi IdP một redirect URI (§8.3 bước 3)
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Giá trị `sessions.public_id` của một session thuộc chính người gọi
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      description: Số phần tử tối đa của trang
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Con trỏ mờ lấy từ `next_cursor` của trang trước
      schema:
        type: string
        maxLength: 512
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Khóa chống lặp request (§13.1) — lưu theo `(tenant, identity, operation, key)`, 24 giờ
      schema:
        type: string
        minLength: 8
        maxLength: 255
        pattern: '^[\x21-\x7E]+$'
    ActorFilter:
      name: actor
      in: query
      required: false
      description: Lọc theo identity của actor
      schema:
        type: string
        format: uuid
    ActionFilter:
      name: action
      in: query
      required: false
      description: Lọc theo `action` (khớp chính xác)
      schema:
        type: string
        maxLength: 128
        pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'
    OutcomeFilter:
      name: outcome
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/AuditOutcome'
    FromFilter:
      name: from
      in: query
      required: false
      description: Từ thời điểm (bao gồm)
      schema:
        type: string
        format: date-time
    ToFilter:
      name: to
      in: query
      required: false
      description: Tới thời điểm (không bao gồm)
      schema:
        type: string
        format: date-time
    JobStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/JobStatus'
    JobKindFilter:
      name: kind
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/JobKind'
    # dual control (P3-T04a) + lời mời (P3-T05a)
    ApprovalId:
      name: approvalId
      in: path
      required: true
      description: ID yêu cầu phê duyệt (`approval_requests.id`)
      schema:
        type: string
        format: uuid
    ApprovalStatusFilter:
      name: status
      in: query
      required: false
      description: Lọc theo trạng thái hiệu lực
      schema:
        $ref: '#/components/schemas/ApprovalStatus'
    ApprovalActionFilter:
      name: action
      in: query
      required: false
      description: Lọc theo thao tác (khớp chính xác)
      schema:
        type: string
        maxLength: 100
        pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'
    InvitationId:
      name: invitationId
      in: path
      required: true
      description: ID lời mời (`tenant_invitations.id`)
      schema:
        type: string
        format: uuid
    TagId:
      name: tagId
      in: path
      required: true
      description: ID tag (`tenant_tags.id`)
      schema:
        type: string
        format: uuid
    PolicyVersionId:
      name: versionId
      in: path
      required: true
      description: ID version policy (`policy_versions.id`)
      schema:
        type: string
        format: uuid
    PolicyAgainst:
      name: against
      in: query
      required: false
      description: Version so sánh (mặc định version mong muốn)
      schema:
        type: string
        format: uuid
    InvitationStatusFilter:
      name: status
      in: query
      required: false
      description: Lọc theo trạng thái hiệu lực
      schema:
        $ref: '#/components/schemas/InvitationStatus'
    PlatformUserId:
      name: platformUserId
      in: path
      required: true
      description: ID của platform user (`platform_users.id`)
      schema:
        type: string
        format: uuid
    PlatformUserStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PlatformUserStatus'
    PlatformRoleFilter:
      name: role
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PlatformRole'
    SettingKey:
      name: settingKey
      in: path
      required: true
      description: Khóa của `system_settings` (ví dụ `approval.ttl_hours`)
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_]*(\.[a-z0-9_]+)*$'
        maxLength: 128
    IdPScopeFilter:
      name: scope
      in: query
      required: false
      schema:
        type: string
        enum: [platform, tenant]
    PlanId:
      name: planId
      in: path
      required: true
      description: ID của gói (`subscription_plans.id`)
      schema:
        type: string
        format: uuid
  headers:
    JobLocation:
      description: Job theo dõi thao tác — `/api/v1/tenants/{tenantId}/jobs/{jobId}` (phạm vi tenant) hoặc `/api/v1/platform/jobs/{jobId}` (phạm vi platform)
      required: true
      schema:
        type: string
        format: uri-reference
    ApprovalLocation:
      description: Yêu cầu phê duyệt của thao tác 2P — `/api/v1/platform/approvals/{approvalId}` (§8.6)
      required: true
      schema:
        type: string
        format: uri-reference
    TenantApprovalLocation:
      description: Yêu cầu phê duyệt phạm vi tenant — `/api/v1/tenants/{tenantId}/approvals/{approvalId}` (§8.6)
      required: true
      schema:
        type: string
        format: uri-reference
    RedirectLocation:
      description: URL chuyển hướng
      required: true
      schema:
        type: string
        format: uri-reference
    SetCookie:
      description: Cookie `__Host-` với `Secure; HttpOnly; SameSite=Lax; Path=/`
      required: true
      schema:
        type: string
    ClearAuthRequestCookie:
      description: >-
        Xóa cookie ràng buộc `__Host-mg_authreq` (`Max-Age=0`) — có ở mọi lỗi của callback xảy ra sau khi auth request
        đã được đọc (auth request chỉ dùng một lần)
      schema:
        type: string
    ETag:
      description: Phiên bản hiện tại của tài nguyên (§6.1) — giá trị cho `If-Match`
      required: true
      schema:
        type: string
    RetryAfter:
      description: Số giây nên chờ trước khi thử lại
      schema:
        type: integer
        minimum: 0
    RateLimitLimit:
      description: Hạn mức của cửa sổ hiện tại
      schema:
        type: integer
        minimum: 0
    RateLimitRemaining:
      description: Số request còn lại trong cửa sổ hiện tại
      schema:
        type: integer
        minimum: 0
    RateLimitReset:
      description: Số giây tới khi hạn mức được nạp lại
      schema:
        type: integer
        minimum: 0
    RequestId:
      description: ID của request (sinh nếu client không gửi) — trùng `Problem.request_id`
      schema:
        type: string
  responses:
    Unauthenticated:
      description: Chưa xác thực — `unauthenticated` (thiếu, hết hạn hoặc đã thu hồi session) hoặc `reauth_required` (cần step-up, §8.3 bước 7)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Không đủ quyền — `forbidden` (gồm CSRF/origin không hợp lệ), `tenant_suspended` (tenant bị suspend chặn thao tác ghi) hoặc `quota_exceeded`
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Không tìm thấy — `not_found`, kể cả ID thuộc tenant khác (§8.4 bất biến 6)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Xung đột — `conflict`; request trước với cùng `Idempotency-Key` chưa xong thì kèm `Retry-After`
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: Thiếu điều kiện trước — `precondition_required` (thao tác sửa cần `If-Match` mang `ETag` hiện tại)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: Dữ liệu không hợp lệ — `validation_failed` (chi tiết ở `errors[]`) hoặc `idempotency_key_reuse` (cùng key, khác request)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Vượt hạn mức — `rate_limited` (token bucket theo identity và theo IP, §13.1)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UpstreamRejected:
      description: Upstream từ chối hoặc trả lời bất thường — `upstream_rejected`; ở các operation này là Headscale của tenant (lý do đã lọc; thông điệp gốc chỉ ghi vào log nội bộ, §13.4)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AuthCallbackUnauthenticated:
      description: >-
        Đăng nhập thất bại — `unauthenticated` (state lạ, đã dùng hoặc hết hạn; IdP mix-up; cookie ràng buộc thiếu hoặc
        không khớp; IdP trả lỗi; token hoặc ID token không hợp lệ) hoặc `reauth_required` (đăng nhập platform mà ID token
        không có bằng chứng yếu tố thứ hai trong `amr` — G2 vòng 2 A-6; ví dụ lần đăng nhập vừa đăng ký TOTP: đăng nhập
        lại với `reauth=true`); xóa cookie `__Host-mg_authreq`
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Set-Cookie:
          $ref: '#/components/headers/ClearAuthRequestCookie'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AuthCallbackForbidden:
      description: >-
        IdP đã xác thực nhưng không được phép — `forbidden` (claim bắt buộc của IdP, email chưa xác minh, domain email
        ngoài danh sách, identity bị vô hiệu); xóa cookie `__Host-mg_authreq`
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Set-Cookie:
          $ref: '#/components/headers/ClearAuthRequestCookie'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AuthCallbackUnexpected:
      description: >-
        Lỗi khác — `upstream_rejected` (IdP không tới được hoặc trả lời bất thường), `internal_error`; xóa cookie
        `__Host-mg_authreq` khi lỗi xảy ra sau khi auth request đã được đọc
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Set-Cookie:
          $ref: '#/components/headers/ClearAuthRequestCookie'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InstanceUnavailable:
      description: Headscale của tenant không phản hồi — `instance_unavailable`
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unexpected:
      description: Lỗi khác — mã ổn định theo bảng `ProblemCode`, `internal_error` cho lỗi không lường trước
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: Điều kiện trước không còn đúng — `precondition_failed` (ví dụ `payload_sha256` người duyệt đã xem khác payload hiện tại)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    # ------------------------------------------------------------ lỗi (RFC 9457, §13.1, §13.3)
    Problem:
      type: object
      description: RFC 9457 problem details (§13.1, §13.3)
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
          format: uri
          description: Loại lỗi — `urn:meshguard:problem:<code>`
          examples: ['urn:meshguard:problem:not_found']
        title:
          type: string
          description: Tóm tắt ngắn, cố định theo `code`
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Giải thích cho người đọc — không bao giờ chứa secret, stack trace hay thông điệp thô của upstream
        instance:
          type: string
          format: uri-reference
          description: Path của request gây lỗi
        code:
          $ref: '#/components/schemas/ProblemCode'
        request_id:
          type: string
          description: Giá trị `X-Request-Id` của request
        errors:
          type: array
          description: Lỗi theo từng trường (với `validation_failed`)
          items:
            $ref: '#/components/schemas/FieldError'
    ProblemCode:
      type: string
      description: |-
        Mã lỗi ổn định (§13.1) — client dựa vào `code`, không dựa vào `title`/`detail`.
        `unauthenticated`, `reauth_required` (401) · `forbidden`, `tenant_suspended`, `quota_exceeded` (403) ·
        `not_found` (404, kể cả ID chéo tenant) · `conflict` (409) · `precondition_failed` (412) ·
        `precondition_required` (428, thiếu `If-Match`) · `validation_failed`, `idempotency_key_reuse` (422) ·
        `rate_limited` (429) · `upstream_rejected` (502, upstream từ chối, không tới được hoặc trả lời bất thường —
        Headscale của tenant, IdP ở luồng đăng nhập) · `instance_unavailable` (503) · `maintenance` (503, nền tảng ở
        chế độ bảo trì — sau khi restore PostgreSQL, tới khi đối soát xong và người vận hành tắt bảo trì; chỉ đăng nhập
        platform trên admin. còn được phục vụ — P3-T17, §17.2; kèm `Retry-After`) · `internal_error` (500) ·
        `not_implemented` (501, operation chưa có handler).
      enum:
        - unauthenticated
        - reauth_required
        - forbidden
        - tenant_suspended
        - quota_exceeded
        - not_found
        - conflict
        - precondition_failed
        - precondition_required
        - validation_failed
        - idempotency_key_reuse
        - rate_limited
        - upstream_rejected
        - instance_unavailable
        - maintenance
        - internal_error
        - not_implemented
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: Đường dẫn tới trường lỗi, ví dụ `given_name`
        code:
          type: string
          description: Mã lỗi của trường, ví dụ `pattern`, `required`
        message:
          type: string
    # ------------------------------------------------------------ chung
    ResourceRef:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          examples: [device]
        id:
          type: string
    HealthStatus:
      type: string
      description: Kết quả health check gần nhất; `unknown` khi chưa từng kiểm
      enum: [healthy, unhealthy, unknown]
    HealthReason:
      type: string
      description: |-
        Lý do ổn định khi `status` khác `healthy` — không bao giờ là thông điệp thô của Headscale (§13.4 quy tắc 5).
        Kết quả probe: `instance_unavailable`, `circuit_open`, `database_unreachable`, `unsupported_version`,
        `api_key_rejected`, `edge_rejected`, `not_located`, `upstream_rejected`, `incomplete_probe`, `internal`. Không có
        kết luận: `no_instance`, `never_checked`, `stale`, `instance_not_running`, `invalid_record`. Thành phần nền
        tảng: `no_heartbeat`, `heartbeat_stale`, `heartbeat_failed`, `no_probe`, `not_deployed`. Tập giá trị chỉ được
        bổ sung (cộng thêm).
      pattern: '^[a-z][a-z0-9_]{0,63}$'
      examples: [instance_unavailable]
    StatusCounts:
      type: object
      description: Số lượng theo trạng thái
      additionalProperties:
        type: integer
        minimum: 0
    # ------------------------------------------------------------ auth (§8.3)
    SessionOrigin:
      type: string
      description: Origin nơi session được tạo — session của `app` bị từ chối trên `admin` và ngược lại (§8.3 bước 8)
      enum: [app, admin]
    Principal:
      type: object
      description: Danh tính đã đăng nhập (`identities`, §8.1)
      required: [identity_id, scope, idp_id, display_name]
      properties:
        identity_id:
          type: string
          format: uuid
        scope:
          type: string
          description: Danh tính của IdP platform hay của IdP một tenant (§8.4 bất biến 1)
          enum: [platform, tenant]
        idp_id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          type: string
        platform_role:
          type: string
          description: Khóa role platform (ví dụ `super_admin`) — chỉ khi `scope` là `platform`
    SessionMembership:
      type: object
      required: [membership_id, tenant_id, tenant_slug, tenant_name, role, status]
      properties:
        membership_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        tenant_slug:
          $ref: '#/components/schemas/TenantSlug'
        tenant_name:
          type: string
        role:
          type: string
          description: Khóa role phạm vi tenant (`roles.key`, seed ở P2-T07)
        status:
          type: string
          description: Trạng thái membership
    SupportGrantSummary:
      type: object
      description: Support Access Grant đang hiệu lực của nhân sự nền tảng (§8.7) — có từ P4-T13, trước đó danh sách luôn rỗng
      required: [id, tenant_id, effective_role, expires_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        effective_role:
          type: string
          enum: [support_operator, support_admin]
        expires_at:
          type: string
          format: date-time
    Session:
      type: object
      description: Session hiện tại (§8.3) — chỉ mang danh tính; membership, role và grant đọc từ DB ở mỗi request
      required: [principal, origin, csrf_token, auth_time, idle_expires_at, absolute_expires_at, memberships, support_grants]
      properties:
        principal:
          $ref: '#/components/schemas/Principal'
        origin:
          $ref: '#/components/schemas/SessionOrigin'
        csrf_token:
          type: string
          description: Giá trị gửi trong header `X-CSRF-Token`; dẫn xuất từ session id, mất hiệu lực cùng session
        auth_time:
          type: string
          format: date-time
          description: Thời điểm xác thực tại IdP (claim `auth_time`) — cơ sở của step-up (≤ 15 phút)
        idle_expires_at:
          type: string
          format: date-time
        absolute_expires_at:
          type: string
          format: date-time
        memberships:
          type: array
          description: Membership đang hoạt động (chỉ với danh tính phạm vi tenant)
          items:
            $ref: '#/components/schemas/SessionMembership'
        support_grants:
          type: array
          items:
            $ref: '#/components/schemas/SupportGrantSummary'
    LogoutResult:
      type: object
      description: Kết quả của `POST /auth/logout` (G2 vòng 2, A-1)
      required: [redirect_to]
      properties:
        redirect_to:
          type: string
          format: uri
          maxLength: 20480
          description: >-
            URL tuyệt đối (https) trình duyệt phải tới: `end_session_endpoint` của IdP với `client_id`,
            `post_logout_redirect_uri` và `id_token_hint` (nếu session giữ được), hoặc chính `post_logout_redirect_uri`
            khi IdP không hỗ trợ đăng xuất. Không lưu, không ghi log giá trị này (chứa ID token).
    SessionSummary:
      type: object
      required: [id, origin, created_at, last_seen_at, auth_time, idle_expires_at, absolute_expires_at, current]
      properties:
        id:
          type: string
          format: uuid
          description: Giá trị `sessions.public_id` (không phải session id)
        origin:
          $ref: '#/components/schemas/SessionOrigin'
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        auth_time:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
        absolute_expires_at:
          type: string
          format: date-time
        ip:
          type: string
        user_agent:
          type: string
        current:
          type: boolean
          description: Là session của chính request này
    SessionList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SessionSummary'
        next_cursor:
          type: [string, 'null']
    # ------------------------------------------------------------ tenant (§13.3)
    TenantSlug:
      type: string
      description: Slug của tenant — nhãn DNS, bất biến (§11.3 bước 1)
      pattern: '^[a-z][a-z0-9-]{1,30}[a-z0-9]$'
      examples: [tenant-a]
    TenantStatus:
      type: string
      description: Trạng thái tenant (`tenants.status`, §6.3)
      enum: [pending, provisioning, active, suspended, deprovisioning, deleted, failed]
    PlanLimits:
      type: object
      description: Giới hạn hiệu lực của gói sau override (§13.3); thiếu khóa nghĩa là gói không đặt giới hạn đó
      additionalProperties: false
      properties:
        max_devices:
          type: integer
          minimum: 0
        max_users:
          type: integer
          minimum: 0
        max_tagged_devices:
          type: integer
          minimum: 0
        max_live_enrollment_credentials:
          type: integer
          minimum: 0
        backup_interval_minutes:
          type: integer
          minimum: 1
        instance:
          $ref: '#/components/schemas/InstanceLimits'
    InstanceLimits:
      type: object
      description: Giới hạn container của instance theo gói (§14.5)
      additionalProperties: false
      properties:
        cpus:
          type: number
          minimum: 0
        memory_mb:
          type: integer
          minimum: 0
        pids:
          type: integer
          minimum: 0
    Tenant:
      type: object
      description: Tenant (§13.3)
      required: [id, slug, name, status, deployment_region, plan, limits, control_url, created_at, updated_at, version]
      properties:
        id:
          type: string
          format: uuid
        slug:
          $ref: '#/components/schemas/TenantSlug'
        name:
          type: string
          minLength: 1
          maxLength: 128
        status:
          $ref: '#/components/schemas/TenantStatus'
        deployment_region:
          type: string
        plan:
          type: string
          description: Khóa gói (`subscription_plans.key`)
        limits:
          $ref: '#/components/schemas/PlanLimits'
        control_url:
          type: string
          format: uri
          description: Login server của tailnet — `https://<slug>.mesh.<domain>`
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 0
          description: Bộ đếm khóa lạc quan — nguồn của `ETag`
    TenantList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tenant'
        next_cursor:
          type: [string, 'null']
    # ------------------------------------------------------------ xóa tenant (§11.4 Deprovision, P3-T09)
    TenantDeletion:
      type: object
      description: Xin xóa một tenant (luôn cần người thứ hai duyệt — §8.5)
      required: [confirm_slug, reason]
      additionalProperties: false
      properties:
        confirm_slug:
          type: string
          minLength: 1
          maxLength: 63
          description: Slug của tenant, người yêu cầu gõ lại để xác nhận đúng tenant (khác slug ⇒ `422`)
        skip_final_backup:
          type: boolean
          default: false
          description: >-
            Người vận hành bỏ qua bản backup cuối (chỉ khi không lấy được — ví dụ instance quarantined hoặc dữ liệu
            hỏng): người duyệt thấy cờ này; job ghi audit + `security_event` High `tenant.deprovision_without_backup` và
            giữ nguyên thư mục dữ liệu (bản duy nhất) thay vì xóa
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Lý do (yêu cầu của khách hàng, ticket) — người duyệt đọc trước khi duyệt
    # ------------------------------------------------------------ tạo tenant (§13.3 TenantCreate, P3-T05)
    TenantCreate:
      type: object
      description: >-
        Yêu cầu tạo tenant (§13.3). `identity_provider.driver = keycloak`: realm riêng của tenant trên IdP do nền tảng host
        (tên realm = slug, client `mg-portal`) — không nhận issuer/client; `external`: issuer + client của tenant (client
        secret chỉ-ghi).
      required: [slug, name, plan_key, owner_email, identity_provider]
      additionalProperties: false
      properties:
        slug:
          $ref: '#/components/schemas/TenantSlug'
        name:
          type: string
          minLength: 1
          maxLength: 128
        plan_key:
          type: string
          description: Khóa gói (`subscription_plans.key`, gói đang mở)
          pattern: '^[a-z][a-z0-9_-]{0,62}$'
        deployment_region:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
        owner_email:
          type: string
          format: email
          maxLength: 320
          description: Email của Tenant Owner — nhận lời mời ở bước 16 (§11.3)
        identity_provider:
          $ref: '#/components/schemas/TenantIdentityProviderCreate'
        settings:
          type: object
          description: TenantSettings ban đầu (§13.3) — ghi ở bước 16 `tenant.configure`
          additionalProperties: true
    TenantIdentityProviderCreate:
      type: object
      required: [driver]
      additionalProperties: false
      properties:
        driver:
          type: string
          enum: [keycloak, external]
        issuer:
          type: string
          format: uri
          maxLength: 512
          description: Chỉ với `external` — `https://…`
        client_id:
          type: string
          minLength: 1
          maxLength: 255
          description: Chỉ với `external`
        client_secret:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 4096
          description: Chỉ-ghi, chỉ với `external` — vào SecretStore, không bao giờ được trả lại (§8.2)
        required_claims:
          type: object
          additionalProperties: true
        allowed_email_domains:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 253
    # ------------------------------------------------------------ dashboard (§16.4)
    DeviceCounts:
      type: object
      required: [total, online, synced_at]
      properties:
        total:
          type: integer
          minimum: 0
        online:
          type: integer
          minimum: 0
          description: Theo góc nhìn của control plane tại lần sync gần nhất
        synced_at:
          type: [string, 'null']
          format: date-time
          description: Lần sync gần nhất; `null` khi chưa từng sync
    UnavailableSection:
      type: object
      description: Mục của dashboard chưa có số liệu thật — báo "không khả dụng" kèm lý do thay vì số giả (§12.3, §16.4)
      required: [section, reason]
      properties:
        section:
          type: string
          description: Mục của dashboard — `devices`, `policies`, `routes`, `relay`, `security_events` (chỉ bổ sung)
          pattern: '^[a-z][a-z0-9_]{0,63}$'
        reason:
          type: string
          description: >-
            `never_synced` (sổ thiết bị chưa từng sync — các số đếm của `devices` không phải số liệu), `no_source` (nền
            tảng chưa có nguồn cho mục này), `not_served` (có nguồn nhưng dashboard chưa phục vụ số liệu này)
          pattern: '^[a-z][a-z0-9_]{0,63}$'
        detail:
          type: string
          description: Câu giải thích ngắn (tiếng Anh) cho người đọc; phần ổn định là `reason`
    TenantDashboard:
      type: object
      description: >-
        Tổng quan của một tenant (§16.4): mọi số kèm thời điểm quan sát (`devices.synced_at`, `instance.checked_at`);
        mục chưa có nguồn thật nằm trong `unavailable` kèm lý do
      required: [devices, instance, unavailable]
      properties:
        devices:
          $ref: '#/components/schemas/DeviceCounts'
        instance:
          $ref: '#/components/schemas/InstanceHealth'
        unavailable:
          type: array
          items:
            $ref: '#/components/schemas/UnavailableSection'
    # ------------------------------------------------------------ devices (§13.3)
    Device:
      type: object
      description: Thiết bị (node của Headscale) trong sổ thiết bị của nền tảng (§13.3); dữ liệu cache kèm `synced_at`
      required: [id, name, given_name, ip_addresses, tags, register_method, online, last_seen, expiry, routes, tags_etag, revocation, synced_at]
      properties:
        id:
          type: string
          format: uuid
          description: ID thiết bị của nền tảng — không phải node id của Headscale
        name:
          type: string
          description: Hostname do client báo
        given_name:
          type: string
          description: Tên trong tailnet (nhãn DNS), đổi bằng `PATCH`
        ip_addresses:
          type: array
          description: Địa chỉ trong tailnet
          items:
            type: string
        owner:
          $ref: '#/components/schemas/DeviceOwner'
        tags:
          type: array
          items:
            type: string
            pattern: '^tag:[a-z][a-z0-9-]{0,49}$'
        register_method:
          type: string
          description: Cách node đăng ký theo Headscale (ví dụ `authkey`, `cli`, `oidc`)
        online:
          type: boolean
          description: Góc nhìn của control plane tại lần sync gần nhất — không phải phép đo đường truyền
        last_seen:
          type: [string, 'null']
          format: date-time
        expiry:
          type: [string, 'null']
          format: date-time
          description: Hạn của node; `null` là không hết hạn
        routes:
          $ref: '#/components/schemas/DeviceRoutes'
        tags_etag:
          type: string
          description: Hash tập tag đọc trực tiếp từ Headscale — giá trị `If-Match` của `PUT …/tags` (Phase 4)
        revocation:
          $ref: '#/components/schemas/DeviceRevocation'
        synced_at:
          type: string
          format: date-time
          description: Thời điểm đồng bộ gần nhất từ Headscale
    DeviceOwner:
      type: object
      description: Chủ thiết bị — vắng khi node thuộc tag
      required: [membership_id, display_name]
      properties:
        membership_id:
          type: string
          format: uuid
        display_name:
          type: string
    DeviceRoutes:
      type: object
      required: [advertised, approved, etag]
      properties:
        advertised:
          type: array
          description: Prefix do node quảng bá
          items:
            type: string
        approved:
          type: array
          description: Prefix đã được duyệt
          items:
            type: string
        etag:
          type: string
          description: Hash tập route đã duyệt — giá trị `If-Match` của `routes/approve` (Phase 4)
    DeviceRevocation:
      type: object
      description: |-
        Trạng thái thu hồi hai pha (§13.5 `device.revoke`, T-17): `pending` sau khi nhận yêu cầu; `applied` chỉ khi
        đọc lại từ Headscale đã khớp; `failed` khi Headscale từ chối hoặc hết lượt retry.
      required: [state]
      properties:
        state:
          type: string
          enum: [none, pending, applied, failed]
        kind:
          type: string
          enum: [expire, delete]
        requested_at:
          type: string
          format: date-time
        verified_at:
          type: string
          format: date-time
    DeviceRename:
      type: object
      additionalProperties: false
      required: [given_name]
      properties:
        given_name:
          type: string
          description: Tên mới — nhãn DNS (chữ thường, số, dấu gạch ngang; tối đa 63 ký tự), kiểm cục bộ trước khi gọi Headscale
          pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
    DeviceList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Device'
        next_cursor:
          type: [string, 'null']
    # ------------------------------------------------------------ users (§6.3 tenant_memberships)
    Membership:
      type: object
      description: Thành viên của tenant (`tenant_memberships` + `identities`)
      required: [id, identity_id, display_name, role, status, headscale_username, version]
      properties:
        id:
          type: string
          format: uuid
          description: ID membership
        identity_id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          type: string
        role:
          type: string
          description: Khóa role phạm vi tenant (`roles.key`, seed ở P2-T07)
        status:
          type: string
          description: >-
            Trạng thái membership (CHECK của 0024 — P4-T09): `active`; `locked` (khóa Portal, mở lại được); `offboarded`
            (cuối — node và pre-auth key bị expire, identity bị vô hiệu)
        headscale_username:
          type: string
          description: Headscale user tương ứng — `mg-<membership_uuid>`
          pattern: '^mg-[0-9a-f-]{36}$'
        version:
          type: integer
          format: int64
          minimum: 0
        offboarding:
          $ref: '#/components/schemas/MembershipOffboarding'
    MembershipList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
        next_cursor:
          type: [string, 'null']
    # ------------------------------------------------------------ users / groups (P4-T09)
    MembershipOffboarding:
      type: object
      description: >-
        Trạng thái hai pha của offboard (T-17): job `member.offboard` mới nhất của membership — `pending` tới khi job đọc
        lại node/key/IdP, `applied` khi xong, `failed` khi kết thúc lỗi (`DELETE` lại ⇒ job mới)
      required: [state, job_id]
      properties:
        state:
          type: string
          enum: [pending, applied, failed]
        job_id:
          type: string
          format: uuid
    MembershipUpdate:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          description: '`locked` khóa (thu hồi mọi session), `active` mở khóa'
          enum: [active, locked]
    MembershipRoleUpdate:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          description: Role mới — chỉ các role dưới Tenant Admin
          enum: [tenant_operator, tenant_viewer, end_user]
    MembershipAdminRoleUpdate:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          description: Role mới (gán `tenant_admin`, hoặc gỡ Admin / hạ Owner xuống role thấp hơn)
          enum: [tenant_admin, tenant_operator, tenant_viewer, end_user]
    OwnershipTransfer:
      type: object
      additionalProperties: false
      required: [membership_id]
      properties:
        membership_id:
          type: string
          format: uuid
          description: Thành viên `active` nhận role Owner
        previous_owner_role:
          type: string
          description: Role người gọi giữ sau khi chuyển (mặc định `tenant_admin`; `tenant_owner` = giữ Owner)
          enum: [tenant_owner, tenant_admin]
    GroupMember:
      type: object
      required: [membership_id, display_name, role, status]
      properties:
        membership_id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          type: string
        role:
          type: string
        status:
          type: string
    Group:
      type: object
      description: >-
        Group người dùng (`groups`, render thành `group:<name>` của policy — §7.2); `sensitive` đọc từ
        `TenantSettings.policy.sensitive_groups` (§13.3): đổi thành viên cần phê duyệt trong tenant
      required: [id, name, source, sensitive, member_count, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,49}$'
        description:
          type: string
        source:
          type: string
          enum: [portal, idp]
        sensitive:
          type: boolean
        member_count:
          type: integer
          minimum: 0
        members:
          type: array
          description: Chỉ ở `GET /groups/{id}` và response của thao tác ghi
          items:
            $ref: '#/components/schemas/GroupMember'
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GroupList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Group'
        next_cursor:
          type: [string, 'null']
    GroupCreate:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,49}$'
        description:
          type: string
          maxLength: 1000
    GroupUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,49}$'
        description:
          type: string
          maxLength: 1000
          description: Chuỗi rỗng xóa mô tả
    GroupMembersUpdate:
      type: object
      additionalProperties: false
      required: [membership_ids]
      properties:
        membership_ids:
          type: array
          description: Tập thành viên mới (rỗng = bỏ mọi thành viên)
          maxItems: 1000
          items:
            type: string
            format: uuid
    # ------------------------------------------------------------ audit (§13.3)
    AuditOutcome:
      type: string
      enum: [success, denied, failure]
    AuditActor:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [identity, system, support]
        identity_id:
          type: string
          format: uuid
        display_name:
          type: string
          description: Ảnh chụp tên hiển thị lúc ghi
        support_grant_id:
          type: string
          format: uuid
    AuditEvent:
      type: object
      description: Sự kiện audit (§13.3)
      required: [id, occurred_at, actor, action, resource, outcome, request_id, details]
      properties:
        id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/AuditActor'
        action:
          type: string
          description: Giá trị `x-audit-action` của operation, có thể kèm hậu tố `.requested`/`.succeeded`/`.failed`
        resource:
          $ref: '#/components/schemas/ResourceRef'
        outcome:
          $ref: '#/components/schemas/AuditOutcome'
        request_id:
          type: string
        operation_id:
          type: string
          format: uuid
          description: Nối cặp sự kiện `*.requested` → `*.succeeded`/`*.failed` (§6.1) — không phải `operationId` của spec
        details:
          type: object
          additionalProperties: true
    AuditEventList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type: [string, 'null']
    # ------------------------------------------------------------ jobs (§13.3, §13.5)
    JobKind:
      type: string
      description: Job kind (§13.5), ví dụ `inventory.sync`, `device.revoke`, `tenant.provision`
      pattern: '^[a-z][a-z_]*(\.[a-z][a-z_]*)+$'
    JobStatus:
      type: string
      description: Trạng thái job (`provisioning_jobs.status`, §6.3)
      enum: [queued, running, failed_resumable, compensating, rolled_back, succeeded, failed, cancelled]
    JobStepStatus:
      type: string
      description: Trạng thái step (`provisioning_job_steps.status`, tập giá trị chốt ở P2-T12 — CHECK của 0006)
      enum: [running, succeeded, failed, skipped]
    JobStep:
      type: object
      required: [name, status, attempt, started_at, finished_at, message]
      properties:
        name:
          type: string
        status:
          $ref: '#/components/schemas/JobStepStatus'
        attempt:
          type: integer
          minimum: 0
        started_at:
          type: [string, 'null']
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
        message:
          type: [string, 'null']
          description: Thông điệp đã lọc, sinh từ danh mục mẫu theo mã — không chép lỗi thô của orchestrator/Agent
    JobError:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Mã lỗi ổn định của job
    Job:
      type: object
      description: Job — phép chiếu an toàn cho người gọi phạm vi tenant (§13.3)
      required: [id, kind, status, current_step, steps, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/JobKind'
        tenant_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/JobStatus'
        current_step:
          type: [string, 'null']
        resource:
          $ref: '#/components/schemas/ResourceRef'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/JobStep'
        error:
          $ref: '#/components/schemas/JobError'
        created_at:
          type: string
          format: date-time
    JobList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        next_cursor:
          type: [string, 'null']
    # ------------------------------------------------------------ notifications (§6.3, P3-T05b)
    Notification:
      type: object
      required: [id, kind, payload, created_at, read_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          description: Sự kiện được thông báo (`notification_outbox.kind`), ví dụ `policy.applied`, `device.new`, `support.break_glass`
          pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$'
          maxLength: 100
        payload:
          type: object
          description: Trường của `kind` (id, tên, thời điểm RFC 3339) + `tenant_name`, `tenant_slug`, `locale` — không có secret
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        read_at:
          type: [string, 'null']
          format: date-time
    NotificationList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        next_cursor:
          type: [string, 'null']
    PlatformJobStep:
      description: Step kèm chi tiết thô (đã redaction) — chỉ ở `GET /platform/jobs/{jobId}`
      allOf:
        - $ref: '#/components/schemas/JobStep'
        - type: object
          properties:
            detail:
              type: object
              additionalProperties: true
            compensation_status:
              $ref: '#/components/schemas/JobStepStatus'
    PlatformJobError:
      description: Lỗi gốc của job (đã redaction) — chỉ ở `GET /platform/jobs/{jobId}`
      allOf:
        - $ref: '#/components/schemas/JobError'
        - type: object
          properties:
            message:
              type: string
            detail:
              type: object
              additionalProperties: true
    PlatformJob:
      type: object
      description: Job kèm chi tiết thô của từng step và lỗi gốc (§13.3)
      required: [id, kind, status, current_step, steps, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/JobKind'
        tenant_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/JobStatus'
        current_step:
          type: [string, 'null']
        resource:
          $ref: '#/components/schemas/ResourceRef'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/PlatformJobStep'
        error:
          $ref: '#/components/schemas/PlatformJobError'
        created_at:
          type: string
          format: date-time
    # ------------------------------------------------------------ platform (§6.3, §16.2)
    InstanceStatus:
      type: string
      description: TenantInstanceStatus (§13.3)
      enum: [allocated, starting, running, stopped, failed, removed, quarantined]
    InstanceHealth:
      type: object
      description: >-
        Kết quả health probe gần nhất của instance qua adapter (`GET /version`, `GET /api/v1/health` — §16.2);
        `checked_at` là lúc probe bắt đầu, `null` khi chưa từng probe. Kết quả cũ hơn ngưỡng, hoặc instance không ở
        trạng thái `running`, cho `status = unknown` kèm `reason`
      required: [status, checked_at]
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        checked_at:
          type: [string, 'null']
          format: date-time
        reason:
          $ref: '#/components/schemas/HealthReason'
    Instance:
      type: object
      description: Headscale instance của một tenant (`tenant_instances`, §6.3) — không chứa secret
      required: [id, tenant_id, host_id, status, headscale_version, image_digest, control_hostname, server_url, run_uid, net_cidr, health, version]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        host_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/InstanceStatus'
        headscale_version:
          type: string
          examples: [v0.29.7]
        image_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        control_hostname:
          type: string
        server_url:
          type: string
          format: uri
        derp_region_id:
          type: integer
        run_uid:
          type: integer
          minimum: 0
        net_cidr:
          type: string
        api_key_expires_at:
          type: string
          format: date-time
          description: Hạn của API key hiện hành (cảnh báo khi còn dưới 14 ngày — §16.3)
        noise_key_fingerprint:
          type: string
        health:
          $ref: '#/components/schemas/InstanceHealth'
        version:
          type: integer
          format: int64
          minimum: 0
    InstanceList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Instance'
        next_cursor:
          type: [string, 'null']
    # ------------------------------------------------------------ backup/restore (§6.3 `backups` — P3-T11)
    InstanceRestoreCreate:
      type: object
      description: Xin restore một instance từ một bản backup (luôn cần người thứ hai duyệt — §8.5)
      required: [backup_id, reason]
      additionalProperties: false
      properties:
        backup_id:
          type: string
          format: uuid
          description: Bản backup `succeeded` của chính instance này (`GET /platform/backups?instance=…`)
        restore_point_older_than_backup:
          type: boolean
          default: false
          description: >-
            Người vận hành khẳng định PostgreSQL đã được khôi phục về thời điểm cũ hơn bản backup (§17.2 bước 4):
            policy trong bản backup được giữ và nhập thành version cần rà soát; không đặt lại route/tag và không thu hồi
            lại theo PostgreSQL; tenant được đánh dấu cần Owner rà soát
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Lý do (sự cố, ticket) — người duyệt đọc trước khi duyệt
    BackupStatus:
      type: string
      description: >-
        Trạng thái hàng `backups` (0011): `running` (đang chạy), `succeeded` (archive + manifest ký đã kiểm), `failed`,
        `purged` (archive đã xóa theo retention; hàng giữ để audit)
      enum: [running, succeeded, failed, purged]
    BackupKind:
      type: string
      description: Loại bản backup — `instance` (Headscale của một tenant, P3-T11); các loại phạm vi nền tảng nhập về sau
      enum: [instance, postgres, idp, edge]
    BackupMethod:
      type: string
      description: '`vacuum_into` (instance đang chạy, data/ chỉ-đọc) hoặc `cold_copy` (instance đang dừng)'
      enum: [vacuum_into, cold_copy]
    Backup:
      type: object
      description: >-
        Một bản backup (§6.3 `backups`). Không chứa data key đã bọc hay nội dung manifest — chỉ digest của ciphertext
        (`sha256`) và của manifest ký (`manifest_sha256`)
      required: [id, kind, status, storage_uri, started_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/BackupKind'
        status:
          $ref: '#/components/schemas/BackupStatus'
        tenant_id:
          type: [string, 'null']
          format: uuid
        instance_id:
          type: [string, 'null']
          format: uuid
        sequence:
          type: [integer, 'null']
          format: int64
          description: Số thứ tự tăng dần của archive trong thư mục của instance (ghi trong manifest ký)
        method:
          oneOf:
            - $ref: '#/components/schemas/BackupMethod'
            - type: 'null'
        size_bytes:
          type: [integer, 'null']
          format: int64
        sha256:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
        manifest_sha256:
          type: [string, 'null']
          pattern: '^[0-9a-f]{64}$'
        headscale_version:
          type: [string, 'null']
        storage_uri:
          type: string
          description: Vị trí archive (không chứa credential)
        started_at:
          type: string
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
        verified_at:
          type: [string, 'null']
          format: date-time
          description: Lần restore từ bản này hoàn tất gần nhất
        job_id:
          type: [string, 'null']
          format: uuid
    BackupList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Backup'
        next_cursor:
          type: [string, 'null']
    # ------------------------------------------------------------ instance.reconfigure (§11.4, §13.5 — P3-T13)
    InstanceLogLevel:
      type: string
      description: '`log.level` của Headscale (§11.3 bước 8: chỉ `info`, `warn`, `error`)'
      enum: [info, warn, error]
    InstanceReconfigure:
      type: object
      description: >-
        Tham số do nền tảng quản lý của cấu hình instance (§11.1 `HeadscaleParams`); trường vắng mặt giữ giá trị của
        version đang hiệu lực. `derp.server.ipv4` luôn render lại từ điểm vào công khai hiện tại của host (§17.4) —
        `{}` render lại đúng version hiện hành với giá trị mới nhất của registry (không đổi gì ⇒ job kết thúc không
        restart). Thiết lập DNS, OIDC, hạn khóa của tenant đi qua API Phase 4 (cùng job)
      additionalProperties: false
      properties:
        log_level:
          $ref: '#/components/schemas/InstanceLogLevel'
        node_expiry_days:
          type: integer
          minimum: 1
          maximum: 3650
          description: '`node.expiry` theo ngày (render thành giờ — Headscale 0.29.7 không có đơn vị ngày)'
        nameservers:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          description: >-
            `dns.nameservers.global` (`override_local_dns` — RT-07): địa chỉ IP unicast dùng được (không loopback,
            link-local, multicast), không trùng; ngoài dải network tenant của host (Agent kiểm)
          items:
            type: string
            minLength: 2
            maxLength: 45
        derp_region_id:
          type: integer
          minimum: 900
          maximum: 999
          description: '`derp.server.region_id` của DERP nhúng (§10.1)'
    # ------------------------------------------------------------ instance.upgrade (§11.4, §17.6 — P3-T13a)
    InstanceUpgrade:
      type: object
      description: >-
        Image Headscale đích theo digest (`sha256:<64 hex>`); phải nằm trong allowlist của Host Agent (sinh từ
        versions.lock) — Agent là bên quyết định, API chỉ kiểm định dạng
      additionalProperties: false
      required: [image_digest]
      properties:
        image_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: Digest của image đích (không nhận tag)
    # ------------------------------------------------------------ platform hosts (§6.3 `hosts`, migration 0014 — P3-T04)
    InstanceQuarantineRequest:
      type: object
      description: Quarantine một instance (§11.4) — lý do ghi vào audit và security event
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Lý do (sự cố, ticket, dấu hiệu bị chiếm)
    InstanceReleaseRequest:
      type: object
      description: Gỡ quarantine của một instance (luôn cần người thứ hai duyệt)
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Lý do và kết luận điều tra — người duyệt đọc trước khi duyệt
    HostStatus:
      type: string
      description: >-
        Trạng thái host (`hosts.status`, 0014): `active` nhận instance mới; `draining` giữ instance đang có, không nhận
        mới; `disabled` ngừng hẳn — placement chỉ chọn host `active`
      enum: [active, draining, disabled]
    HostEntryMode:
      type: string
      description: Đường vào công khai của host (§15.3) — `direct` (IP của chính host) hoặc `vps_gateway` (qua VPS gateway)
      enum: [direct, vps_gateway]
    HostCapacity:
      type: object
      additionalProperties: false
      required: [max_instances]
      properties:
        max_instances:
          type: integer
          format: int64
          minimum: 0
          maximum: 2147483647
          description: Trần số instance chưa `removed` trên host; `0` = không nhận instance mới
    HostPublicEntry:
      type: object
      description: >-
        Điểm vào công khai (`hosts.public_entry`, §10.1): `ipv4` là `derp.server.ipv4` của mọi instance trên host — IPv4
        thập phân chuẩn (không số 0 đứng đầu), unicast dùng được (ngoài 0/8, 127/8, 169.254/16, 224/3), nằm ngoài
        `tenant_net_pool`; host chưa có `ipv4` không được placement chọn. Khóa `ipv6` chưa nhận ở MVP
      additionalProperties: false
      properties:
        ipv4:
          type: string
          format: ipv4
        mode:
          $ref: '#/components/schemas/HostEntryMode'
    HostRange:
      type: object
      description: Dải số nguyên, gồm cả hai đầu (`first` ≤ `last`)
      additionalProperties: false
      required: [first, last]
      properties:
        first:
          type: integer
          format: int64
        last:
          type: integer
          format: int64
    HostUsage:
      type: object
      description: >-
        Mức dùng của host lúc đọc: `live_instances` = instance chưa `removed` (so với `capacity.max_instances`),
        `by_status` = số instance chưa `removed` theo trạng thái, `run_uids_free` = UID của `run_uid_range` chưa từng
        được cấp (UID không tái sử dụng, kể cả sau `removed`; không tính UID/GID của service core), `net_slots_free` = số
        /29 của `tenant_net_pool` chưa thuộc instance chưa `removed`
      required: [live_instances, by_status, run_uids_free, net_slots_free]
      properties:
        live_instances:
          type: integer
          minimum: 0
        by_status:
          $ref: '#/components/schemas/StatusCounts'
        run_uids_free:
          type: integer
          format: int64
          minimum: 0
        net_slots_free:
          type: integer
          format: int64
          minimum: 0
    Host:
      type: object
      description: Host chạy instance (`hosts`, §6.3) — không chứa secret
      required: [id, name, region, status, capacity, public_entry, run_uid_range, tenant_net_pool, usage, last_heartbeat_at, created_at, updated_at, etag]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Tên host — nhãn DNS, bất biến
          pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
        region:
          type: string
        status:
          $ref: '#/components/schemas/HostStatus'
        capacity:
          $ref: '#/components/schemas/HostCapacity'
        public_entry:
          $ref: '#/components/schemas/HostPublicEntry'
        run_uid_range:
          $ref: '#/components/schemas/HostRange'
        stun_port_range:
          $ref: '#/components/schemas/HostRange'
        tenant_net_pool:
          type: string
          description: Dải cấp subnet /29 cho network của tenant (IPv4 CIDR)
          examples: [10.250.0.0/16]
        usage:
          $ref: '#/components/schemas/HostUsage'
        last_heartbeat_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        etag:
          type: string
          description: >-
            Hash cấu hình của host (`region`, `status`, `capacity`, `public_entry`, các dải) — giá trị `If-Match` của
            `PATCH` và của header `ETag`; heartbeat không làm nó đổi (bảng `hosts` không có cột `version`)
    HostList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Host'
        next_cursor:
          type: [string, 'null']
    HostCreate:
      type: object
      description: >-
        Host mới. Mặc định: `status` = `active`, `capacity` = `{"max_instances": 100}`, `public_entry` = `{}`, không có
        `stun_port_range` (STUN chung — MVP). `run_uid_range` trong 1000…2147483646 và không chứa UID/GID của service
        core; `tenant_net_pool` IPv4 /8…/29 ngoài 100.64.0.0/10; `stun_port_range` trong 1024…65535. `capacity` và
        `public_entry` được đọc đúng như CHECK của 0014 đọc cột jsonb: khóa lạ (ví dụ `ipv6`), thiếu `max_instances`,
        giá trị không phải số nguyên (`10.0`) ⇒ `422` theo trường
      additionalProperties: false
      required: [name, region, run_uid_range, tenant_net_pool]
      properties:
        name:
          type: string
          description: Nhãn DNS (chữ thường, số, dấu gạch ngang; tối đa 63 ký tự)
          pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
        region:
          type: string
          description: 1–64 ký tự, không có khoảng trắng
          minLength: 1
          maxLength: 64
        status:
          $ref: '#/components/schemas/HostStatus'
        capacity:
          $ref: '#/components/schemas/HostCapacity'
          x-go-type: json.RawMessage
        public_entry:
          $ref: '#/components/schemas/HostPublicEntry'
          x-go-type: json.RawMessage
        run_uid_range:
          $ref: '#/components/schemas/HostRange'
        stun_port_range:
          $ref: '#/components/schemas/HostRange'
        tenant_net_pool:
          type: string
          description: IPv4 CIDR dạng chuẩn `a.b.c.d/n`
    HostUpdate:
      type: object
      description: >-
        Các trường muốn đổi (ít nhất một); `capacity` và `public_entry` thay cả object (`{}` xóa điểm vào công khai).
        `region` và các dải cấp phát chỉ đổi được khi host không còn instance chưa `removed`
      additionalProperties: false
      minProperties: 1
      properties:
        region:
          type: string
          minLength: 1
          maxLength: 64
        status:
          $ref: '#/components/schemas/HostStatus'
        capacity:
          $ref: '#/components/schemas/HostCapacity'
          x-go-type: json.RawMessage
        public_entry:
          $ref: '#/components/schemas/HostPublicEntry'
          x-go-type: json.RawMessage
        run_uid_range:
          $ref: '#/components/schemas/HostRange'
        stun_port_range:
          $ref: '#/components/schemas/HostRange'
        tenant_net_pool:
          type: string
    ComponentHealth:
      type: object
      required: [name, status, checked_at]
      properties:
        name:
          type: string
          description: Thành phần, ví dụ `postgres`, `edge`, `agent`
        status:
          $ref: '#/components/schemas/HealthStatus'
        checked_at:
          type: [string, 'null']
          format: date-time
        reason:
          $ref: '#/components/schemas/HealthReason'
    TenantCounts:
      type: object
      required: [total, by_status]
      properties:
        total:
          type: integer
          minimum: 0
        by_status:
          $ref: '#/components/schemas/StatusCounts'
    InstanceCounts:
      type: object
      description: >-
        Instance chưa `removed`: theo trạng thái, theo health (`healthy`/`unhealthy`/`unknown`, cùng quy tắc với
        `InstanceHealth`) và theo version Headscale báo ở lần probe gần nhất (`by_version` chỉ đếm instance đã báo
        version); `unhealthy` = `by_health.unhealthy`
      required: [total, by_status, unhealthy, by_health, by_version]
      properties:
        total:
          type: integer
          minimum: 0
        by_status:
          $ref: '#/components/schemas/StatusCounts'
        unhealthy:
          type: integer
          minimum: 0
        by_health:
          $ref: '#/components/schemas/StatusCounts'
        by_version:
          $ref: '#/components/schemas/StatusCounts'
    JobQueueHealth:
      type: object
      description: >-
        Hàng đợi job của nền tảng (`provisioning_jobs`, §13.5) tại `checked_at`: `unfinished` = job chưa kết thúc theo
        trạng thái (`queued`, `running`, `compensating`, `failed_resumable`); `failed_last_24h` = job kết thúc `failed`
        hoặc `rolled_back` trong 24 giờ trước `checked_at`
      required: [checked_at, unfinished, failed_last_24h]
      properties:
        checked_at:
          type: string
          format: date-time
        unfinished:
          $ref: '#/components/schemas/StatusCounts'
        failed_last_24h:
          type: integer
          minimum: 0
    PlatformHealth:
      type: object
      required: [checked_at, components, tenants, instances, jobs]
      properties:
        checked_at:
          type: string
          format: date-time
        components:
          type: array
          items:
            $ref: '#/components/schemas/ComponentHealth'
        tenants:
          $ref: '#/components/schemas/TenantCounts'
        instances:
          $ref: '#/components/schemas/InstanceCounts'
        jobs:
          $ref: '#/components/schemas/JobQueueHealth'
    # ------------------------------------------------------------ relay (§6.3 `relay_regions`/`relay_assignments`, §10.6 — P3-T05c)
    RelayRegionKind:
      type: string
      description: >-
        `embedded` (DERP nhúng trong Headscale của tenant — MVP, ADR-11), `standalone` (derper riêng của một tenant —
        phương án lùi §10.3), `shared` (relay dùng chung — research proposal §10.5, Phase 7)
      enum: [embedded, standalone, shared]
    RelayAdminStatus:
      type: string
      description: >-
        Trạng thái quản trị (`relay_regions.status`, `relay_assignments.status` — 0010); sức khỏe đo được nằm ở `health`,
        không ở đây
      enum: [pending, active, disabled]
    RelayCheck:
      type: object
      description: >-
        Một phép kiểm của lần probe gần nhất, đo bởi prober bên trong nền tảng (`duration_ms` là thời gian của phép kiểm
        từ prober — không phải độ trễ client thấy)
      required: [ok, duration_ms]
      properties:
        ok:
          type: boolean
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: Trạng thái HTTP nhận được (chỉ `derp`); vắng khi không nhận được câu trả lời
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: >-
            Mã lỗi ổn định của prober khi phép kiểm không đạt (`timeout`, `refused`, `unreachable`, `tls_handshake`,
            `tls_verify`, `bad_response`, `no_mapped_address`, `expectation_failed`…); vắng khi đạt
        duration_ms:
          type: integer
          format: int64
          minimum: 0
    RelayHealth:
      type: object
      description: >-
        Health của region từ lần probe tổng hợp gần nhất (`derp`: `GET /derp/probe` qua listener công khai của edge ⇒
        200; `stun`: STUN binding tới địa chỉ STUN của region ⇒ có mapped address). `checked_at` là lúc probe bắt đầu,
        `null` khi chưa từng probe; kết quả cũ hơn ngưỡng, region/assignment không `active`, instance không chạy, hoặc
        loại region chưa được probe ⇒ `status = unknown` kèm `reason`; `derp`/`stun` là các phép kiểm của lần probe ở
        `checked_at`
      required: [status, checked_at]
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        checked_at:
          type: [string, 'null']
          format: date-time
        reason:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: >-
            Lý do ổn định khi `status` khác `healthy`. Kết quả probe: `derp_probe_failed`, `stun_probe_failed`,
            `relay_unreachable` (cả hai). Không có kết luận: `never_checked`, `stale`, `invalid_record`,
            `instance_not_running`, `relay_not_active`, `no_probe`. Tập giá trị chỉ được bổ sung (cộng thêm)
        derp:
          $ref: '#/components/schemas/RelayCheck'
        stun:
          $ref: '#/components/schemas/RelayCheck'
    RelayRegion:
      type: object
      description: >-
        Region relay (`relay_regions`, §6.3) — tham số công khai, như client của tenant thấy trong DERP map; không chứa
        secret
      required: [id, code, name, kind, derp_region_id, hostname, derp_port, verify_mode, status]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: '`region_code` (ví dụ `mg-<slug>`, §10.1)'
        name:
          type: string
        kind:
          $ref: '#/components/schemas/RelayRegionKind'
        derp_region_id:
          type: integer
          minimum: 900
          maximum: 999
        hostname:
          type: string
        ipv4:
          type: string
          format: ipv4
          description: Địa chỉ quảng bá của điểm vào công khai (`derp.server.ipv4`, §10.1)
        ipv6:
          type: string
          format: ipv6
        stun_port:
          type: integer
          minimum: 1
          maximum: 65535
        derp_port:
          type: integer
          minimum: 1
          maximum: 65535
        verify_mode:
          type: string
          description: '`in_process` (`verify_clients` của DERP nhúng) | `verify_url` (fail-closed)'
          enum: [in_process, verify_url]
        status:
          $ref: '#/components/schemas/RelayAdminStatus'
    RelayUnavailable:
      type: object
      description: Số đo relay nền tảng KHÔNG báo — "không khả dụng" kèm lý do thay vì số giả (§10.6, §12.4)
      required: [metric, reason]
      properties:
        metric:
          type: string
          description: >-
            `traffic_bytes`, `throughput`, `connections`, `auth_failures`, `client_latency` (chỉ bổ sung; một mục rời
            danh sách khi task xây nguồn của nó hoàn tất)
          pattern: '^[a-z][a-z0-9_]{0,63}$'
        reason:
          type: string
          description: '`unsupported` (thành phần không cung cấp được — embedded DERP không xuất metrics relay), `no_source` (nền tảng chưa có nguồn)'
          pattern: '^[a-z][a-z0-9_]{0,63}$'
        detail:
          type: string
          description: Câu giải thích ngắn (tiếng Anh) cho người đọc; phần ổn định là `reason`
    RelayAssignment:
      type: object
      description: Một relay của tenant — assignment của instance tới một region (`relay_assignments`), kèm health của region
      required: [id, priority, status, region, health]
      properties:
        id:
          type: string
          format: uuid
        priority:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/RelayAdminStatus'
        region:
          $ref: '#/components/schemas/RelayRegion'
        health:
          $ref: '#/components/schemas/RelayHealth'
    TenantRelay:
      type: object
      description: Relay của tenant (§12.3 mục Relay) — mỗi health kèm `checked_at`; số đo không có nguồn ở `unavailable`
      required: [assignments, unavailable]
      properties:
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/RelayAssignment'
        unavailable:
          type: array
          items:
            $ref: '#/components/schemas/RelayUnavailable'
    PlatformRelayAssignment:
      type: object
      description: Assignment của một region như nhân sự nền tảng thấy (metadata registry)
      required: [id, tenant_id, instance_id, priority, status, instance_status]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        instance_id:
          type: string
          format: uuid
        priority:
          type: integer
          minimum: 0
        status:
          $ref: '#/components/schemas/RelayAdminStatus'
        instance_status:
          $ref: '#/components/schemas/InstanceStatus'
    PlatformRelayRegion:
      type: object
      required: [region, tenant_id, assignments, health, created_at, updated_at, version]
      properties:
        region:
          $ref: '#/components/schemas/RelayRegion'
        tenant_id:
          type: [string, 'null']
          format: uuid
          description: Tenant sở hữu region (`embedded`, `standalone`); `null` với region `shared`
        host_id:
          type: string
          format: uuid
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/PlatformRelayAssignment'
        health:
          $ref: '#/components/schemas/RelayHealth'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          minimum: 1
    RelayRegionList:
      type: object
      required: [items, next_cursor, unavailable]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlatformRelayRegion'
        next_cursor:
          type: [string, 'null']
        unavailable:
          type: array
          items:
            $ref: '#/components/schemas/RelayUnavailable'
    # ------------------------------------------------------------ dual control (§8.5/§8.6 2P, §6.3 — P3-T04a)
    ApprovalStatus:
      type: string
      description: >-
        `pending` → `approved` (người thứ hai) → `executed` (thực thi một lần, cùng transaction với job — trạng thái
        cuối); `pending` → `rejected`; `pending`/`approved` quá `expires_at` → `expired`
      enum: [pending, approved, rejected, expired, executed]
    IdentityRef:
      type: object
      description: Một danh tính kèm tên hiển thị đọc lúc trả lời
      required: [identity_id, display_name]
      properties:
        identity_id:
          type: string
          format: uuid
        display_name:
          type: string
    ApprovalRequest:
      type: object
      description: >-
        Yêu cầu dual control (`approval_requests`). `payload` là tham số đã chuẩn hóa của thao tác — đúng thứ sẽ được
        thực thi, không chứa secret; `payload_sha256` = SHA-256 (hex) của JSON chuẩn hóa của nó (khóa sắp xếp theo byte,
        không khoảng trắng, không escape HTML, chỉ số nguyên). Người duyệt gửi lại đúng hash này khi duyệt.
      required: [id, scope, action, resource_type, payload, payload_sha256, status, requested_by, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        scope:
          type: string
          enum: [platform, tenant]
        action:
          type: string
          description: Thao tác cần phê duyệt (ví dụ `platform.instance.restore`)
          examples: [platform.instance.restore]
        resource_type:
          type: string
          examples: [instance]
        resource_id:
          type: string
        payload:
          type: object
          additionalProperties: true
          description: Tham số sẽ thực thi, nguyên văn (ví dụ `backup_id` và `instance_id` của restore)
          x-go-type: json.RawMessage
        payload_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        reason:
          type: string
          description: Lý do của người yêu cầu
        requested_by:
          $ref: '#/components/schemas/IdentityRef'
        decided_by:
          $ref: '#/components/schemas/IdentityRef'
        decided_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        job_id:
          type: string
          format: uuid
          description: Job do thao tác enqueue khi thực thi (chỉ ở `executed`)
        created_at:
          type: string
          format: date-time
    ApprovalList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalRequest'
        next_cursor:
          type: [string, 'null']
    ApprovalDecision:
      type: object
      description: Quyết định duyệt — mang hash của đúng payload người duyệt đã xem
      required: [payload_sha256]
      additionalProperties: false
      properties:
        payload_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    # ------------------------------------------------------------ phiên console quản trị Keycloak (§8.2 (3) — P3-T15)
    IdpConsoleSessionCreate:
      type: object
      description: Xin một phiên console quản trị Keycloak (luôn cần người thứ hai duyệt)
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Lý do (ticket, sự cố) — người duyệt đọc trước khi duyệt
        duration_minutes:
          type: integer
          minimum: 5
          maximum: 60
          default: 30
          description: Thời hạn của phiên, tính từ lúc được duyệt
        source_cidr:
          type: string
          maxLength: 64
          description: >-
            Mạng nguồn được mở console, dạng chuẩn (`203.0.113.7/32`); IPv4 /24–/32, IPv6 /56–/128. Mặc định: đúng
            địa chỉ của người xin (/32 hoặc /128)
          examples: [203.0.113.7/32]
    IdpConsoleSessionStatus:
      type: string
      description: >-
        `pending` (chờ người thứ hai) → `active` (đã duyệt, trong thời hạn) → `ended` (hết hạn) | `rejected` |
        `expired` (yêu cầu hết hạn khi chưa ai duyệt)
      enum: [pending, active, ended, rejected, expired]
    IdpConsoleSession:
      type: object
      description: Một phiên console quản trị Keycloak = một yêu cầu dual control `platform.idp.console_session`
      required: [id, status, requested_by, source_cidr, duration_minutes, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: ID của yêu cầu phê duyệt (`/platform/approvals/{id}`)
        status:
          $ref: '#/components/schemas/IdpConsoleSessionStatus'
        requested_by:
          $ref: '#/components/schemas/IdentityRef'
        approved_by:
          $ref: '#/components/schemas/IdentityRef'
        reason:
          type: string
        source_cidr:
          type: string
        duration_minutes:
          type: integer
        starts_at:
          type: string
          format: date-time
          description: Lúc được duyệt (phiên bắt đầu)
        ends_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    IdpConsoleSessionList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IdpConsoleSession'
        next_cursor:
          type: [string, 'null']
    # ------------------------------------------------------------ lời mời (§6.3 tenant_invitations, §8.2 — P3-T05a)
    InvitationStatus:
      type: string
      description: >-
        `pending` → `accepted` (lần đăng nhập đầu qua đúng IdP, email đã xác minh trùng, còn hạn — một lần) |
        `revoked` | `expired` (gửi lại đưa lời mời hết hạn về `pending`)
      enum: [pending, accepted, revoked, expired]
    InvitationRole:
      type: string
      description: >-
        Role một Tenant Owner/Admin ghi được vào lời mời (quy tắc role đích 3a của §8.4 quyết định role nào người gọi
        được mời); Tenant Owner không bao giờ được mời qua API (chỉ lời mời Owner đầu tiên do orchestrator tạo)
      enum: [tenant_admin, tenant_operator, tenant_viewer, end_user]
    Invitation:
      type: object
      description: Lời mời người chưa từng đăng nhập (`tenant_invitations`) — không bao giờ chứa token
      required: [id, email, role, status, expires_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          description: Khóa role phạm vi tenant (`roles.key`)
        status:
          $ref: '#/components/schemas/InvitationStatus'
        expires_at:
          type: string
          format: date-time
        invited_by:
          $ref: '#/components/schemas/IdentityRef'
        accepted_identity_id:
          type: string
          format: uuid
        accepted_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    InvitationList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
        next_cursor:
          type: [string, 'null']
    InvitationCreate:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 320
          description: Email người được mời — phải là email đã xác minh của họ ở IdP của tenant
        role:
          $ref: '#/components/schemas/InvitationRole'
        expires_in_hours:
          type: integer
          minimum: 1
          maximum: 720
          default: 168
          description: Hạn của lời mời (mặc định 7 ngày, tối đa 30 ngày)
    InvitationResend:
      type: object
      additionalProperties: false
      properties:
        expires_in_hours:
          type: integer
          minimum: 1
          maximum: 720
          default: 168
    TagPurpose:
      type: string
      description: >-
        Mục đích của tag (`tenant_tags.purpose`, bất biến): `server`, `custom` do tenant khai báo; `router`, `exit` là tag
        do nền tảng kiểm soát (§7.2 — chỉ chúng được `autoApprovers` nêu)
      enum: [router, exit, server, custom]
    Tag:
      type: object
      description: Một tag của danh mục (`tenant_tags`) — render vào `tagOwners` với danh sách owner rỗng (§7.2)
      required: [id, name, purpose, platform_managed, version, etag, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          pattern: '^tag:[a-z][a-z0-9-]{0,49}$'
        purpose:
          $ref: '#/components/schemas/TagPurpose'
        platform_managed:
          type: boolean
          description: Tag do nền tảng tạo và quản lý — chỉ đọc qua API của tenant
        description:
          type: string
          maxLength: 1000
        version:
          type: integer
          format: int64
        etag:
          type: string
          description: Phiên bản hiện tại — giá trị `If-Match` của `PATCH`/`DELETE`
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PolicyPrincipal:
      type: object
      description: |-
        Tham chiếu principal có kiểu (§7.2): `user` — `ref` = membership id (render `mg-<membership>@`); `group` — group id;
        `tag` — tag id của danh mục; `resource` — id tài nguyên mạng (render alias trong `hosts`); `autogroup` — `member`,
        `tagged`, `self`, `internet`, `danger-all` (tùy vị trí); `cidr` — `*`, một địa chỉ IP hoặc prefix.
      additionalProperties: false
      required: [type, ref]
      properties:
        type:
          type: string
          enum: [user, group, tag, resource, autogroup, cidr]
        ref:
          type: string
          minLength: 1
          maxLength: 64
    PolicyGrant:
      type: object
      additionalProperties: false
      required: [src, dst]
      properties:
        src:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/PolicyPrincipal'
        dst:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/PolicyPrincipal'
        ip:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 64
        app:
          type: object
          description: Capability ứng dụng (tên → danh sách đối tượng), mã hóa lại khi render
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties: true
        via:
          type: array
          maxItems: 100
          description: Chỉ principal `tag`
          items:
            $ref: '#/components/schemas/PolicyPrincipal'
    PolicySSHRule:
      type: object
      additionalProperties: false
      required: [action, src, dst, users]
      properties:
        action:
          type: string
          enum: [accept, check]
          description: '`accept` cần xác nhận (L10 — forwarding luôn bật); `check` bị chặn (V-26)'
        src:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/PolicyPrincipal'
        dst:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/PolicyPrincipal'
        users:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            maxLength: 40
        check_period:
          type: string
          maxLength: 8
    PolicyAutoApprovers:
      type: object
      additionalProperties: false
      description: Mặc định không sinh; principal không phải tag router/exit của nền tảng cần xác nhận (L7)
      properties:
        routes:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/PolicyPrincipal'
        exit_node:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/PolicyPrincipal'
    PolicyAcknowledgement:
      type: object
      additionalProperties: false
      required: [rule, reason]
      properties:
        rule:
          type: string
          enum: [L4, L7, L10, L12, L13]
          description: L4 và L12 chỉ có hiệu lực khi một Tenant Owner duyệt version
        reason:
          type: string
          minLength: 5
          maxLength: 500
    PolicySource:
      type: object
      description: |-
        Nội dung có kiểu của một version (§13.3): `groups`, `hosts` và `tagOwners` **không** nằm ở đây — được render từ
        bảng `groups`/`group_members`, `network_resources`, `tenant_tags` lúc áp dụng.
      additionalProperties: false
      required: [grants]
      properties:
        grants:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/PolicyGrant'
        ssh:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/PolicySSHRule'
        auto_approvers:
          $ref: '#/components/schemas/PolicyAutoApprovers'
        acknowledgements:
          type: array
          maxItems: 13
          items:
            $ref: '#/components/schemas/PolicyAcknowledgement'
    PolicyFinding:
      type: object
      required: [rule, severity, code, message]
      properties:
        rule:
          type: string
        severity:
          type: string
          enum: [error, warning, info]
        code:
          type: string
        path:
          type: string
        line:
          type: integer
          minimum: 1
          description: Dòng của văn bản HuJSON (chỉ ở kết quả `import`)
        message:
          type: string
        requires_ack:
          type: boolean
        owner_only:
          type: boolean
        acknowledged:
          type: boolean
    PolicyValidationReport:
      type: object
      description: Kết quả lint/render/CheckPolicy (`policy_versions.validation_report`); `tests` luôn rỗng (chưa sinh)
      required: [engine, result, errors, warnings, info, tests]
      properties:
        engine:
          type: string
        result:
          type: string
          enum: [passed, failed]
        errors:
          type: array
          items:
            $ref: '#/components/schemas/PolicyFinding'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PolicyFinding'
        info:
          type: array
          items:
            $ref: '#/components/schemas/PolicyFinding'
        tests:
          type: array
          items: {}
        rendered_sha256:
          type: string
        check:
          type: string
          enum: [passed, failed, skipped]
        revision:
          type: integer
          format: int64
        validated_at:
          type: string
          format: date-time
    PolicyVersion:
      type: object
      description: Một version policy (`policy_versions` — §7.3); không chứa trạng thái áp dụng
      required: [id, version, revision, etag, kind, state, content_sha256, desired, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        revision:
          type: integer
          format: int64
        etag:
          type: string
          description: Giá trị `If-Match` của mọi thao tác trên version
        kind:
          type: string
          enum: [user, baseline, suspension]
        state:
          type: string
          enum: [draft, validated, pending_approval, approved, rejected, superseded]
        content_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        source:
          $ref: '#/components/schemas/PolicySource'
        hujson:
          type: string
          description: Văn bản HuJSON của version do nền tảng phát hành hoặc nhập lại (không có `source`)
        validation_report:
          $ref: '#/components/schemas/PolicyValidationReport'
        parent_version_id:
          type: string
          format: uuid
        rollback_of:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        submitted_by:
          type: string
          format: uuid
        submitted_at:
          type: string
          format: date-time
        approved_by:
          type: string
          format: uuid
        approved_at:
          type: string
          format: date-time
        review_mode:
          type: string
          enum: [peer, self]
        rejected_by:
          type: string
          format: uuid
        rejected_at:
          type: string
          format: date-time
        rejected_reason:
          type: string
        desired:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PolicyVersionList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PolicyVersion'
        next_cursor:
          type: [string, 'null']
    PolicyApplication:
      type: object
      description: Một lần áp dụng (`policy_applications` — §13.3)
      required: [id, policy_version_id, trigger, state, applied_sha256, created_at]
      properties:
        id:
          type: string
          format: uuid
        policy_version_id:
          type: string
          format: uuid
        trigger:
          type: string
          enum: [bootstrap, manual, group_change, resource_change, tag_change, suspend, resume, restore, drift_repair, rollback]
        state:
          type: string
          enum: [pending, applied, failed, unknown]
        applied_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        headscale_updated_at:
          type: string
          format: date-time
        error_code:
          type: string
        requested_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
    PolicyCurrent:
      type: object
      required: [four_eyes, apply_step_up]
      properties:
        desired:
          $ref: '#/components/schemas/PolicyVersion'
        applied:
          $ref: '#/components/schemas/PolicyApplication'
        latest:
          $ref: '#/components/schemas/PolicyApplication'
        four_eyes:
          type: boolean
        apply_step_up:
          type: boolean
    PolicyCreate:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          $ref: '#/components/schemas/PolicySource'
        parent_version_id:
          type: string
          format: uuid
    PolicyUpdate:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          $ref: '#/components/schemas/PolicySource'
    PolicyApprove:
      type: object
      additionalProperties: false
      required: [content_sha256]
      properties:
        content_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
    PolicyReject:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    PolicyApplyAccepted:
      type: object
      required: [version, job]
      properties:
        version:
          $ref: '#/components/schemas/PolicyVersion'
        job:
          $ref: '#/components/schemas/Job'
    PolicyDiffLine:
      type: object
      required: [op, text]
      properties:
        op:
          type: string
          enum: [same, removed, added]
        text:
          type: string
    PolicyDiff:
      type: object
      required: [version_id, lines, lines_omitted, grants_added, grants_removed, report_blocking]
      properties:
        version_id:
          type: string
          format: uuid
        against_id:
          type: string
          format: uuid
        from_sha256:
          type: string
        to_sha256:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PolicyDiffLine'
        lines_omitted:
          type: boolean
        grants_added:
          type: array
          items:
            type: string
        grants_removed:
          type: array
          items:
            type: string
        report_blocking:
          type: boolean
    PolicyPrincipalName:
      type: object
      description: Tên HuJSON của một principal có kiểu (`import`/`export` — P4-T11)
      required: [type, ref, name]
      properties:
        type:
          type: string
          enum: [user, group, tag, resource, autogroup, cidr]
        ref:
          type: string
        name:
          type: string
    PolicyImportRequest:
      type: object
      additionalProperties: false
      required: [hujson]
      properties:
        hujson:
          type: string
          maxLength: 1048576
          description: Văn bản HuJSON của admin (chú thích và dấu phẩy cuối được phép)
    PolicyImport:
      type: object
      required: [result, errors, warnings, principals]
      properties:
        result:
          type: string
          enum: [passed, failed]
        source:
          $ref: '#/components/schemas/PolicySource'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/PolicyFinding'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PolicyFinding'
        principals:
          type: array
          items:
            $ref: '#/components/schemas/PolicyPrincipalName'
    PolicyExportRequest:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          $ref: '#/components/schemas/PolicySource'
    PolicyExport:
      type: object
      required: [hujson, warnings, principals]
      properties:
        hujson:
          type: string
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PolicyFinding'
        principals:
          type: array
          items:
            $ref: '#/components/schemas/PolicyPrincipalName'
    TagList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        next_cursor:
          type: [string, 'null']
    TagCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: '^tag:[a-z][a-z0-9-]{0,49}$'
          description: Tên tag — đúng chuỗi thiết bị mang ở Headscale; bất biến
        purpose:
          type: string
          enum: [server, custom]
          default: custom
        description:
          type: string
          maxLength: 1000
    TagUpdate:
      type: object
      required: [description]
      additionalProperties: false
      properties:
        description:
          type: string
          maxLength: 1000
          description: Mô tả mới; chuỗi rỗng xóa mô tả
    DeviceTagsUpdate:
      type: object
      required: [tags]
      additionalProperties: false
      properties:
        tags:
          type: array
          minItems: 1
          maxItems: 64
          description: Tập tag mới (thay thế toàn bộ) — mỗi tag phải có trong danh mục của tenant
          items:
            type: string
            pattern: '^tag:[a-z][a-z0-9-]{0,49}$'
    # ------------------------------------------------------------ P4-T03a: sửa tenant, thiết lập, IdP, platform users, settings, plans
    TenantUpdate:
      type: object
      description: Sửa tenant (§8.5 `platform.tenant:update` — tên, gói, quota); ít nhất một trường
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        plan_key:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,62}$'
          description: Khóa của một gói đang mở
        limits_override:
          $ref: '#/components/schemas/PlanLimits'
          description: Override từng khóa của gói (`subscriptions.overrides`); `{}` gỡ mọi override
          x-go-type: json.RawMessage
    TenantIdentityMode:
      type: string
      enum: [portal, headscale_oidc]
    TenantEnrollmentSettings:
      type: object
      required: [identity_mode, web_auth_enabled, self_enroll, requires_approval]
      properties:
        identity_mode:
          $ref: '#/components/schemas/TenantIdentityMode'
        web_auth_enabled:
          type: boolean
        self_enroll:
          type: boolean
          description: End User tự thêm thiết bị (ô có điều kiện `self_enroll` của §8.6)
        requires_approval:
          type: boolean
        preauth_key_ttl_max:
          type: [string, 'null']
          description: Trần hạn pre-auth key (`<phút>m` hoặc `<giờ>h`, 5 phút – 90 ngày); null = trần của nền tảng
    TenantSettings:
      type: object
      description: >-
        TenantSettings hiệu lực (§13.3). Khóa bảo mật (`enrollment.identity_mode`, `web_auth_enabled`, `self_enroll`,
        `requires_approval`, `node_expiry`, `policy.four_eyes`, `policy.sensitive_groups`, `routes.four_eyes`) chỉ đổi
        qua `PUT /settings/security`; `dns` qua `PUT /dns/settings` (P4-T12).
      required: [enrollment, node_expiry, policy, routes, dns, notifications]
      properties:
        enrollment:
          $ref: '#/components/schemas/TenantEnrollmentSettings'
        node_expiry:
          type: [string, 'null']
          description: Hạn node tối đa của tenant (`0` = không hết hạn, `<ngày>d`, `<giờ>h`); null = theo cấu hình instance
        policy:
          type: object
          required: [four_eyes, sensitive_groups]
          properties:
            four_eyes:
              type: boolean
            sensitive_groups:
              type: array
              items:
                type: string
                format: uuid
        routes:
          type: object
          required: [four_eyes]
          properties:
            four_eyes:
              type: boolean
        dns:
          type: object
          additionalProperties: true
          description: Thiết lập DNS như đã lưu — chỉ để xem ở đây
          x-go-type: json.RawMessage
        notifications:
          type: object
          required: [new_device, policy_applied]
          properties:
            new_device:
              type: boolean
            policy_applied:
              type: boolean
    TenantSettingsView:
      type: object
      required: [settings, etag]
      properties:
        settings:
          $ref: '#/components/schemas/TenantSettings'
        etag:
          type: string
          description: Bằng giá trị header `ETag`
    TenantSettingsPatch:
      type: object
      description: Thiết lập thường (§8.6 `tenant.settings:update`); ít nhất một khóa
      additionalProperties: false
      minProperties: 1
      properties:
        enrollment:
          type: object
          additionalProperties: false
