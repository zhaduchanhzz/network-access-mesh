        /api/v1/tenants/{tenantId}/approvals/{id}` (action `tenant.settings.update_security`, payload = `If-Match` đã
        gửi + thiết lập bảo mật mới). Một Tenant Owner hoặc Tenant Admin **khác** duyệt (`tenant.approval:decide`,
