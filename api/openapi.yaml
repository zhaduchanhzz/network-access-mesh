        - $ref: '#/components/parameters/InvitationId'
      responses:
        '204':
          description: Đã thu hồi
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Unexpected'
  /tenants/{tenantId}/invitations/{invitationId}/resend:
    post:
      tags: [invitations]
      operationId: resendTenantInvitation
      summary: Gửi lại một lời mời (token và hạn mới)
      description: >-
        Lời mời `pending` hoặc `expired` nhận token mới (link cũ mất hiệu lực) và hạn mới, trở lại `pending`, và một thư
        mời mới vào outbox. Đã `accepted`/`revoked` ⇒ `409`.
      security:
        - sessionCookie: []
          csrfToken: []
      x-permission: tenant.invitation:manage
      x-task: P3-T05a
      x-audit-action: invitation.resend
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/InvitationId'
