      summary: Nâng cấp Headscale của một instance — job instance.upgrade (preflight, cold backup, configtest bản đích, tự lùi bằng restore)
      description: |-
        §11.4 hàng Upgrade, §17.6: `image_digest` phải nằm trong allowlist của Host Agent (Agent kiểm). Preflight không
        đổi gì: phiên bản do binary của hai image báo (cùng minor với patch không thấp hơn — bằng nhau là bản build khác
